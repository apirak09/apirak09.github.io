{id:'foundations', chapter:'9.1', title:'เริ่มจาก Time Value of Money', topic:'มูลค่าเงินตามเวลา', pages:'9.1 หน้า 5–7, 30–31', read:'6 นาที', html:`
<p>เงินจำนวนเท่ากันที่ได้รับคนละเวลาไม่ได้มีมูลค่าทางเศรษฐกิจเท่ากันโดยอัตโนมัติ เพราะเงินวันนี้สามารถนำไปลงทุนเพื่อรับผลตอบแทนได้ เวลาจะเทียบทางเลือกต้องย้ายทุกจำนวนไปยังเวลาเดียวกันก่อน</p>
<div class="formula"><b>สัญลักษณ์ที่ต้องรู้</b><br>P = เงินปัจจุบัน / เงินก้อนต้นทาง<br>F = เงินก้อน ณ เวลาปลายทาง<br>A = เงินจำนวนเท่ากันในแต่ละงวด<br>i = อัตราดอกเบี้ยที่แท้จริงต่องวด<br>n = จำนวนงวด &nbsp; G = จำนวนที่เพิ่มขึ้นเท่า ๆ กันต่องวด</div>
<h3>ตัวอย่าง: 930 วันนี้ หรือ 1,000 สิ้นปี?</h3><ol><li>กำหนด i = 7% ต่อปี และนำทั้งสองตัวเลือกไปเทียบที่สิ้นปี</li><li>930 วันนี้มีมูลค่าสิ้นปี = 930(1.07) = <b>995.10</b> บาท</li><li>เปรียบเทียบ 995.10 กับ 1,000 บาท จึงเลือกรับ 1,000 สิ้นปี เมื่อความเสี่ยงและเงื่อนไขอื่นเท่ากัน</li></ol>
<div class="tip"><b>จุดสำคัญ</b> Economic equivalence คือมูลค่าเทียบเท่าที่อัตราและเวลาที่กำหนด ตัวเลขเงินอาจไม่เท่ากัน เช่น 100 วันนี้ เทียบเท่า 110 สิ้นปีที่ 1 เมื่อ i = 10%</div>`},
{id:'interest', chapter:'9.1', title:'ดอกเบี้ยอย่างง่ายและทบต้น', topic:'ดอกเบี้ยอย่างง่ายและทบต้น', pages:'9.1 หน้า 8–14', read:'8 นาที', html:`
<p><b>Simple interest</b> คิดดอกเบี้ยจากเงินต้นเริ่มต้นตลอด ส่วน <b>compound interest</b> นำดอกเบี้ยที่เกิดแล้วไปรวมในฐานของงวดถัดไป</p>
<div class="formula">Simple: I = Pin &nbsp; และ &nbsp; F = P(1 + in)<br>Compound: F = P(1+i)ⁿ &nbsp; และ &nbsp; P = F/(1+i)ⁿ</div>
<h3>ตัวอย่างเปรียบเทียบ</h3><p>ฝาก 10,000 บาท ดอกเบี้ย 8% ต่อปี 3 ปี</p><ol><li>Simple: F = 10,000[1 + (0.08)(3)] = <b>12,400</b> บาท</li><li>Compound รายปี: F = 10,000(1.08)³ = <b>12,597.12</b> บาท</li><li>ส่วนต่างเกิดจากดอกเบี้ยที่ถูกนำไปทบในงวดต่อไป</li></ol>
<h3>ย้อนหา P, i หรือ n</h3><p>P = F/(1+i)ⁿ; i = (F/P)^(1/n) − 1; n = ln(F/P)/ln(1+i) โดยต้องใช้ i และ n ในหน่วยเวลาเดียวกัน</p>
<p>ถ้าอัตราแต่ละปีเปลี่ยน ให้คูณแยก: F = P(1+i₁)(1+i₂)…(1+iₙ) เช่น 5%, 8%, 3% ใช้ 1.05 × 1.08 × 1.03</p>
<div class="tip">ถ้าโจทย์ไม่ชัดว่าดอกเบี้ยทบต้นหรือไม่ ควรดูเงื่อนไขหรือสมมติฐานที่ผู้สอนกำหนด ไม่ควรใช้ simple แทน compound โดยไม่บอก</div>`},
{id:'single-sum', chapter:'9.1', title:'ย้ายเงินก้อนระหว่าง P และ F', topic:'เงินก้อนเดียว P–F', pages:'9.1 หน้า 11–14, 25; ข้อสอบ 2025 ข้อ 16, 23', read:'7 นาที', html:`
<p>เงินก้อนเดียวใช้ F/P เมื่อย้ายไปอนาคต และ P/F เมื่อย้ายกลับอดีต โดย n คือจำนวนงวดระหว่างสองจุดเวลาจริง</p><div class="formula">F = P(F/P,i,n) = P(1+i)ⁿ<br>P = F(P/F,i,n) = F/(1+i)ⁿ</div>
<h3>ตัวอย่าง 1: ต้องการ 100,000 บาทในอีก 5 ปี</h3><ol><li>รู้ F = 100,000, i = 4% ต่อปี, n = 5; ต้องการ P ที่ t=0</li><li>P = 100,000/(1.04)⁵ = <b>82,192.71 บาท</b> หรือประมาณ 82,190 บาทตามช้อยส์</li></ol>
<h3>ตัวอย่าง 2: เปลี่ยนหน่วยการทบต้น</h3><p>F = 21,500 หลัง 10 ปี, nominal 10% ต่อปี ทบปีละ 2 ครั้ง: i = 0.10/2 = 5% ต่อครึ่งปี และ n = 10×2 = 20 งวด ดังนั้น P = 21,500/(1.05)²⁰ ≈ <b>8,103.12 บาท</b></p><div class="tip">ตรวจคำตอบ: เมื่อ i เป็นบวกและ F อยู่ในอนาคต ค่า P ต้องน้อยกว่า F</div>`},
{id:'rates', chapter:'9.1', title:'Nominal, effective และหน่วยเวลา', topic:'Nominal & effective rate', pages:'9.1 หน้า 15–19, 25–27', read:'10 นาที', html:`
<p>Nominal annual rate (j) เป็นอัตราที่อ้างเป็นรายปี ส่วน effective rate บอกการเติบโตจริงในช่วงที่กำหนดหลังคิดผลของการทบต้น <b>ต้องบอกด้วยว่า effective ต่อเดือน ต่อครึ่งปี หรือต่อปี</b></p>
<div class="formula">อัตราต่องวด = j/m<br>Effective ต่อปี = (1 + j/m)ᵐ − 1<br>Nominal ต่อปีจาก effective = m[(1+i<sub>eff</sub>)<sup>1/m</sup> − 1]<br>F = P(1+j/m)^(m × จำนวนปี)</div>
<p>m คือจำนวนงวดทบต้นต่อปี เช่น รายเดือน m=12, รายไตรมาส m=4, ครึ่งปี m=2</p>
<h3>ตัวอย่าง 12% nominal ทบต้นรายเดือน</h3><ol><li>ต่อเดือน i = 0.12/12 = 0.01 = 1%</li><li>หนึ่งปีมี 12 งวด: i<sub>eff</sub> = (1.01)¹² − 1 = <b>12.6825% ต่อปี</b></li><li>ถ้าจ่ายรายเดือน 5 ปี ให้ใช้ i = 1% ต่อเดือน และ n = 60 เดือนในสูตร annuity</li></ol>
<h3>โจทย์ย้อนกลับ</h3><p>Effective 12% ต่อปี ทบต้นรายไตรมาส: j = 4[(1.12)^(1/4) − 1] = <b>11.49% nominal ต่อปี</b></p>
<div class="tip"><b>กับดัก:</b> 9% nominal ต่อปี ทบไตรมาส จะได้ effective ต่อครึ่งปี = (1+0.09/4)²−1 = 4.5506% ไม่ใช่ 9% และไม่ใช่แค่ 9%/2 แบบไม่ทบ</div>`},
{id:'continuous-interest', chapter:'9.1', title:'ทบต้นต่อเนื่อง', topic:'ดอกเบี้ยต่อเนื่อง', pages:'9.1 หน้า 20–24', read:'5 นาที', html:`
<p>เมื่อจำนวนครั้งที่ทบต้นในหนึ่งปีเพิ่มมากขึ้นเรื่อย ๆ สูตร discrete จะเข้าใกล้ลิมิตของการทบต้นต่อเนื่อง</p>
<div class="formula">F = Peʳᵗ<br>Effective ต่อปี = eʳ − 1<br>r = nominal rate ต่อปีแบบทบต้นต่อเนื่อง, t = จำนวนปี</div>
<h3>ตัวอย่าง</h3><p>ทบต้นต่อเนื่องที่ nominal 20% ต่อปี: effective ต่อปี = e<sup>0.20</sup> − 1 = <b>22.14%</b> การหาเงินก้อนหลัง 3 ปีใช้ e<sup>0.20×3</sup></p>
<div class="tip">การทบต้นต่อเนื่องเป็นเรื่อง <b>วิธีคิดดอกเบี้ย</b> ส่วนกระแสเงินสดต่อเนื่องเป็นเรื่อง <b>เวลาในการรับหรือจ่ายเงิน</b> ทั้งสองแนวคิดไม่จำเป็นต้องเกิดพร้อมกัน</div>`},
{id:'inflation', chapter:'9.1', title:'เงินเฟ้อ ดัชนีราคา และกำลังซื้อ', topic:'เงินเฟ้อและกำลังซื้อ', pages:'9.1 หน้า 32–45', read:'9 นาที', html:`
<p>เงินเฟ้อคือระดับราคาสินค้าและบริการโดยทั่วไปเพิ่มขึ้น ทำให้เงินจำนวนเดิมซื้อของได้โดยเฉลี่ยน้อยลง หากอัตราเงินเฟ้อชะลอจาก 6% เหลือ 2% ระดับราคายังเพิ่ม แต่เพิ่มช้าลง ส่วนเงินฝืดคือระดับราคาโดยทั่วไปลดลง</p>
<p><b>Demand-pull:</b> อุปสงค์รวมดันราคา; <b>Cost-push:</b> ต้นทุนผลิตสูงขึ้นแล้วส่งผ่านเข้าสู่ราคา</p>
<div class="formula">ราคาในปี n = ราคาเริ่มต้น × (1+f)ⁿ<br>f เฉลี่ยต่อปี = (ดัชนีปลายงวด/ดัชนีต้นงวด)^(1/n) − 1<br>มูลค่ากำลังซื้อวันนี้ของ F = F/(1+f)ⁿ</div>
<h3>ตัวอย่าง CEPCI</h3><p>ดัชนีจาก 359 เป็น 402 ใน 10 ปี: f = (402/359)^(1/10)−1 = <b>1.14% ต่อปี</b> โดยเป็นอัตราเฉลี่ยแบบทบต้น</p>
<p><b>CPI</b> อ้างอิงตะกร้าสินค้าและบริการผู้บริโภค; <b>CEPCI</b> ใช้ติดตามต้นทุนที่เกี่ยวกับโรงงานเคมี จึงเลือกให้ตรงกับปัญหา ตามสไลด์ Core CPI ของไทยหักหมวดอาหารสดและพลังงานออกจาก CPI ทั่วไป</p>
<div class="tip">ราคาขึ้นสองเท่าใน 10 ปีหมายถึง (1+f)¹⁰=2 จึง f≈7.18% ไม่ใช่ 10% เพราะมีการทบต้น</div>`},
{id:'real-return', chapter:'9.1', title:'ผลตอบแทนหลังหักเงินเฟ้อ', topic:'เงินเฟ้อและกำลังซื้อ', pages:'9.1 หน้า 45–47', read:'6 นาที', html:`
<p>อัตราผลตอบแทนที่เห็นเป็นตัวเงินต้องนำมาเปรียบเทียบกับอัตราเงินเฟ้อในช่วงเดียวกัน เพื่อประเมินกำลังซื้อที่เพิ่มขึ้นจริง</p>
<div class="formula">1 + i<sub>real</sub> = (1 + i<sub>effective</sub>)/(1 + f)<br>i<sub>real</sub> ≈ i<sub>effective</sub> − f เป็นเพียงค่าประมาณ</div>
<h3>ตัวอย่างจากสไลด์</h3><ol><li>Nominal 12% ต่อปี ทบรายเดือน → i<sub>eff</sub> = (1+0.12/12)¹²−1 = 12.6825% ต่อปี</li><li>เงินเฟ้อ f = 6% ต่อปี</li><li>i<sub>real</sub> = 1.126825/1.06 − 1 = <b>6.30% ต่อปี</b></li></ol>
<div class="tip">อย่าเทียบ 1% ต่อเดือนกับเงินเฟ้อ 6% ต่อปีโดยตรง และอย่าเรียก 12−6=6% ว่าคำตอบ exact ในกรณีนี้</div>`},
{id:'diagram', chapter:'9.2', title:'อ่าน Cash Flow Diagram', topic:'แผนภาพกระแสเงินสด', pages:'9.2 หน้า 1–9', read:'7 นาที', html:`
<p>แกนนอนคือเวลา t=0,1,2,… และลูกศรบอกกระแสเงินสดในแต่ละเวลา เลือกมุมมองก่อนเสมอ: เงินเข้าสู่ระบบที่เลือกเป็นบวก และเงินออกเป็นลบ</p>
<h3>ตัวอย่างเงินกู้ 20,000</h3><p>มุมมองผู้กู้: ได้เงิน +20,000 ณ t=0 และจ่ายค่างวดเป็นลบ ส่วนมุมมองธนาคารกลับเครื่องหมาย การเปรียบเทียบเงินต่างเวลาต้องนำไปยังจุดเดียวกันก่อน</p>
<div class="formula">มูลค่าที่เวลา T = Σ CF<sub>t</sub>(1+i)^(T−t)<br>NPV ที่เวลา 0 = CF₀ + CF₁/(1+i) + CF₂/(1+i)² + …</div>
<p><b>Discrete:</b> จ่ายเป็นจุดเวลา เช่น สิ้นเดือน <b>Continuous:</b> เงินไหลตลอดช่วง โดยการทบต้นและการไหลเป็นคนละเรื่อง</p>
<div class="tip">ถ้าเป็นเงินวันนี้ CF₀ ไม่ต้อง discount; สำหรับเงินที่อยู่ t=2 แล้วต้องการ t=5 ให้ใช้จำนวนงวด 5−2=3</div>`},
{id:'factors', chapter:'9.2', title:'เลือก Factor ให้ถูกทิศ', topic:'ปัจจัย P/F และ F/P', pages:'9.2 หน้า 13–16', read:'9 นาที', html:`
<p>อ่าน (สิ่งที่อยากหา / สิ่งที่รู้, i, n) เช่น (P/F,8%,3) หมายถึงตัวคูณหา P เมื่อรู้ F ที่อัตรา 8% และ 3 งวด</p>
<div class="table-wrap"><table><thead><tr><th>ต้องการจากสิ่งที่รู้</th><th>สูตร factor</th><th>ความหมาย</th></tr></thead><tbody>
<tr><td>F จาก P</td><td>F/P = (1+i)ⁿ</td><td>ทบเงินก้อนไปอนาคต</td></tr><tr><td>P จาก F</td><td>P/F = (1+i)⁻ⁿ</td><td>คิดลดเงินก้อนมาปัจจุบัน</td></tr>
<tr><td>F จาก A</td><td>F/A = [(1+i)ⁿ−1]/i</td><td>รวมชุดเงินเท่ากันปลายงวดไป F</td></tr><tr><td>P จาก A</td><td>P/A = [1−(1+i)⁻ⁿ]/i</td><td>คิดลดชุดเงินเท่ากันไป P</td></tr>
<tr><td>A จาก P</td><td>A/P = i(1+i)ⁿ/[(1+i)ⁿ−1]</td><td>เงินก้อนเป็นค่างวด</td></tr><tr><td>A จาก F</td><td>A/F = i/[(1+i)ⁿ−1]</td><td>เงินฝากต่อปีเพื่อสะสม F</td></tr></tbody></table></div>
<p>คู่กลับที่ควรรู้: P/F = 1/(F/P), A/P = 1/(P/A), A/F = 1/(F/A) และ P/A = (F/A)(P/F) เมื่อ i,n ตรงกัน</p><div class="tip">เมื่อ i=0 อย่าหารด้วยศูนย์: ใช้ลิมิตหรือบวกกระแสทีละงวด เช่น P/A = n และ F/A = n</div>`},
{id:'annuity', chapter:'9.2', title:'Uniform Series และการเลื่อนเวลา', topic:'ชุดเงินเท่ากัน A', pages:'9.2 หน้า 10–15, 30', read:'10 นาที', html:`
<p>Ordinary annuity คือ A เท่ากันทุกสิ้นงวด โดย A แรกเกิดหนึ่งงวดหลังจุด P ส่วน F จาก F/A จะอยู่เวลาเดียวกับ A งวดสุดท้าย</p>
<div class="formula">F = A(F/A,i,n) &nbsp;&nbsp; P = A(P/A,i,n)<br>A = P(A/P,i,n) &nbsp;&nbsp; A = F(A/F,i,n)</div>
<h3>ตัวอย่าง: ฝาก 3,000 สิ้นปี 5 ครั้งที่ 6%</h3><ol><li>เป็นชุด A ปลายงวด ต้องการ F ที่ t=5 จึงใช้ F/A</li><li>F = 3,000[(1.06)⁵−1]/0.06 = <b>16,911.28 บาท</b></li></ol>
<h3>ชุดเริ่มช้า (deferred annuity)</h3><p>ถ้าได้รับ 1,000 ที่ t=3,4,5: P/A 3 งวดให้มูลค่า ณ t=2 ก่อน จากนั้นคิดลดสองงวด: P₀ = 1,000(P/A,10%,3)(P/F,10%,2) ≈ <b>2,055.25 บาท</b></p>
<h3>จ่ายต้นงวด</h3><p>หาก A ที่ t=0,1,2,3,4 แทน t=1,2,3,4,5 แล้วต้องการ F₅ ให้คูณ F/A ปกติอีก (1+i) เพราะเงินแต่ละก้อนได้ดอกเบี้ยเพิ่มหนึ่งงวด</p>
<div class="tip">ภาพในสไลด์แสดง A ที่ t=1,2,… จึงควรยึดตำแหน่งบน timeline เป็นหลัก หากคำบรรยายต้นงวด/ปลายงวดกำกวม</div>`},
{id:'loans', chapter:'9.2', title:'เงินกู้ ค่างวด และดอกเบี้ยรวม', topic:'เงินกู้และค่างวด', pages:'9.2 หน้า 19–24', read:'8 นาที', html:`
<p>เงินกู้ P วันนี้เท่ากับมูลค่าปัจจุบันของเงินผ่อน A เท่า ๆ กันทุกสิ้นงวด ดังนั้นเลือก <b>A/P</b> เพื่อหา A</p>
<div class="formula">A = P × i(1+i)ⁿ / [(1+i)ⁿ−1]<br>ดอกเบี้ยที่จ่ายรวมแบบตัวเงิน = A × n − P</div>
<h3>ตัวอย่างกู้ 20,000 ดอลลาร์</h3><ol><li>Nominal 8% ต่อปี ทบรายเดือน, ผ่อน 5 ปี → i = 0.08/12 ต่อเดือน, n = 60</li><li>A = 20,000(A/P, 0.08/12, 60) ≈ <b>405.53 ดอลลาร์ต่อเดือน</b></li><li>คิดจากค่างวดก่อนปัด: ดอกเบี้ยรวม = 60A − 20,000 ≈ <b>4,331.67 ดอลลาร์</b> การปัดค่างวดแต่ละเดือนอาจทำให้ต่างเล็กน้อย</li></ol>
<p>หนี้ก้อนเดียวกันยืดเวลาผ่อนมักทำให้ค่างวดลด แต่จ่ายดอกเบี้ยรวมมากขึ้น เพราะยอดคงค้างอยู่นานขึ้น</p>
<div class="tip">หากโจทย์จ่ายรายปีแต่ทบรายเดือน ให้แปลงเป็น effective รายปีก่อนใช้ factor แบบรายปี</div>`},
{id:'mixed', chapter:'9.2', title:'กระแสเงินสดไม่เท่ากันและ NPV', topic:'กระแสเงินสดหลายช่วงเวลา', pages:'9.2 หน้า 6–9, 17–18', read:'7 นาที', html:`
<p>ถ้าจำนวนเงินแต่ละปีไม่เท่ากัน ไม่ควรใช้ P/A ครอบทั้งหมดโดยไม่มีการแยกชุด ให้แปลงรายการทีละก้อนหรือแยกชุดที่เท่ากันก่อนรวม</p>
<h3>ตัวอย่างจากสไลด์</h3><p>ฝาก 5,000 ที่ t=0; 1,000 ที่ t=1; 2,000 ที่ t=3 และถอน 3,000 ที่ t=4; i = 8% ต้องการเงินที่ t=7</p><div class="formula">F₇ = 5,000(1.08)⁷ + 1,000(1.08)⁶<br>+ 2,000(1.08)⁴ − 3,000(1.08)³<br>= <b>9,097.84</b></div>
<p>แต่ละเลขชี้กำลังเท่ากับ 7−t ของรายการนั้น หากต้องการค่า ณ t=0 ให้หาร F₇ ด้วย (1.08)⁷ ได้ประมาณ <b>5,308.50</b></p>
<div class="tip">NPV = CF₀ + Σ CFₜ/(1+i)ᵗ เครื่องหมายต้องตรงมุมมองผู้ลงทุน และเงินเริ่มต้น CF₀ ไม่ต้องคิดลด</div>`},
{id:'gradient', chapter:'9.2', title:'Arithmetic Gradient: P/G และ A/G', topic:'Gradient และอนุกรมเพิ่ม', pages:'9.2 หน้า 31–39', read:'10 นาที', html:`
<p>Arithmetic gradient คือ cash flow เพิ่มหรือลดด้วย <b>จำนวนคงที่ G</b> แต่ละงวด ไม่ใช่เพิ่มคงที่เป็นร้อยละ แยกเป็น base A ที่เท่ากันทุกปี และส่วน gradient 0, G, 2G, …</p>
<div class="formula">P<sub>รวม</sub> = A<sub>base</sub>(P/A,i,n) + G(P/G,i,n)<br>P/G = [(1+i)ⁿ − in − 1] / [i²(1+i)ⁿ]<br>A<sub>รวม</sub> = A<sub>base</sub> + G(A/G,i,n)<br>A/G = 1/i − n/[(1+i)ⁿ−1]</div>
<h3>ตัวอย่าง</h3><p>ค่าใช้จ่าย 500, 600, …, 1,400 ดอลลาร์ ในปี 1–10, i=5%: base = 500 และ G=100</p><ol><li>P = 500(P/A,5%,10) + 100(P/G,5%,10)</li><li>ใช้ factor ไม่ปัดระหว่างทางได้ขนาดค่าใช้จ่าย <b>7,026.07 ดอลลาร์</b>; ถ้าเงินออกให้ใส่เครื่องหมายลบ</li><li>A = 500 + 100(A/G,5%,10) ≈ <b>909.91 ดอลลาร์/ปี</b></li></ol>
<div class="warning"><b>ตรวจหน่วยกับสไลด์:</b> หน้า 39 แสดง 7,026,050 และ 909,910 ดอลลาร์ แต่กราฟหน้า 37 ระบุ 500 ถึง 1,400 ดอลลาร์ หากตัวเลขกราฟเป็นหน่วยดอลลาร์ตามที่พิมพ์ คำตอบจะเป็น 7,026.07 และ 909.91 ดอลลาร์/ปี การปัด factor แบบในสไลด์ให้ประมาณ 7,026.05 จึงควรตรวจสอบหน่วยที่ผู้สอนตั้งใจ</div>
<p>ถ้าค่าใช้จ่าย <b>ลดลง</b> ปีละจำนวนเท่ากัน ให้ใช้ G ติดลบ เช่น 500,400,300,200 → G = −100</p>`},
{id:'continuous-flow', chapter:'9.2', title:'กระแสเงินสดต่อเนื่อง', topic:'กระแสเงินต่อเนื่อง', pages:'9.2 หน้า 27–29', read:'9 นาที', html:`
<p>ถ้าเงินไหลเข้าหรือออกสม่ำเสมอเป็นอัตรา C ต่อปีตลอดช่วงเวลา แต่ละส่วนได้รับดอกเบี้ยนานไม่เท่ากัน จึงต้องรวมผลตามเวลาจริง</p>
<div class="formula">เงินไหล C ระหว่าง t=a ถึง b และคิดที่ T ≥ b:<br>F<sub>T</sub> = C(e<sup>r(T−a)</sup> − e<sup>r(T−b)</sup>)/r<br>เงินไหล A ต่อเนื่อง 0 ถึง n: P = A(1−e⁻ʳⁿ)/r</div>
<h3>ตรวจตัวอย่างในสไลด์</h3><p>r=12% ต่อปี: ลงทุน 3 ล้านดอลลาร์/ปี ระหว่าง t=−2 ถึง −1 และ 7 ล้าน/ปี ระหว่าง −1 ถึง 0</p><ol><li>ช่วงแรก F₀ = 3(e<sup>0.24</sup>−e<sup>0.12</sup>)/0.12 = <b>3.5938 ล้าน</b></li><li>ช่วงที่สอง F₀ = 7(e<sup>0.12</sup>−1)/0.12 = <b>7.4373 ล้าน</b></li><li>รวมตาม timeline = <b>11.0311 ล้านดอลลาร์</b></li></ol>
<div class="warning">สไลด์หน้า 28 ระบุ 12.44 ล้าน แต่ตัวคูณในเฉลยดูเหมือนทบเพิ่มอีกหนึ่งปีเทียบกับช่วงที่วาด จึงได้ผลต่างจากการรวมตาม timeline นี้ ควรถามผู้สอนว่าตั้งใจใช้ช่วงเวลาใด</div>`},

];

<script>'use strict';
const KEY='econprep_91_92_v1';
const $=s=>document.querySelector(s), main=$('#main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({stats:{},bookmarks:[],learned:[],practice:null,exam:null,round:0});
let state;
try{state={...initial(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=initial()}
if(!state.stats||typeof state.stats!=='object')state.stats={};
if(!Array.isArray(state.bookmarks))state.bookmarks=[];
if(!Array.isArray(state.learned))state.learned=[];
let view='home', lessonId=LESSONS[0].id, reviewFilter='all', timer=null, bankFilter={query:'',chapter:'all',topic:'all'},confirmExamSubmit=false,confirmRestart=false,confirmPracticeReset=false;
const letters=['A','B','C','D'];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('ไม่สามารถบันทึกในเบราว์เซอร์นี้ได้')}}
let toastTimer;
function toast(message){const el=$('#toast');el.textContent=message;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',3000)}
function shuf(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function find(id){return QUESTIONS.find(q=>q.id===id)}
// Keep existing progress, removing obsolete questions and safely adapting unfinished sessions.
function migrateScope(){
 const valid=new Set(QUESTIONS.map(q=>q.id)),validLessons=new Set(LESSONS.map(l=>l.id)),oldStats=state.stats;
 state.bookmarks=state.bookmarks.filter(id=>valid.has(id));state.learned=state.learned.filter(id=>validLessons.has(id));
 const p=state.practice;
 if(p&&Array.isArray(p.ids)&&p.ids.some(id=>!valid.has(id))){
  const oldIds=p.ids.slice(),index=Math.max(0,Math.min(p.index,oldIds.length-1)),current=oldIds[index];
  const removedAnswered=oldIds.filter((id,i)=>!valid.has(id)&&(i<index||(i===index&&p.revealed)));
  p.answered=Math.max(0,(p.answered||0)-removedAnswered.length);
  p.correct=Math.max(0,(p.correct||0)-removedAnswered.filter(id=>oldStats[id]?.lastCorrect===true).length);
  p.ids=oldIds.filter(id=>valid.has(id));p.index=oldIds.slice(0,index).filter(id=>valid.has(id)).length;
  if(!valid.has(current)){p.selected=null;p.revealed=false}
  if(!p.ids.length)state.practice=null;
  else if(p.index>=p.ids.length){p.index=p.ids.length-1;p.finished=true;p.answered=p.ids.length}
 }
 const e=state.exam;
 if(e&&Array.isArray(e.ids)&&e.ids.some(id=>!valid.has(id))){
  e.answers=e.answers||{};e.orders=e.orders||{};
  if(e.finished){for(const id of e.ids.filter(id=>!valid.has(id)))delete e.answers[id];e.ids=e.ids.filter(id=>valid.has(id));e.score=e.ids.reduce((n,id)=>n+(e.answers[id]===find(id).correct?1:0),0);if(!e.ids.length)state.exam=null}
  else for(let i=0;i<e.ids.length;i++){const oldId=e.ids[i];if(valid.has(oldId))continue;const candidates=QUESTIONS.filter(q=>q.chapter==='9.2'&&!e.ids.includes(q.id));if(!candidates.length){state.exam=null;break}const replacement=shuf(candidates)[0].id;e.ids[i]=replacement;delete e.answers[oldId];delete e.orders[oldId];e.orders[replacement]=shuf([0,1,2,3])}
 }
 state.stats=Object.fromEntries(Object.entries(state.stats).filter(([id])=>valid.has(id)));
 try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}
}
migrateScope();
function stat(id){return state.stats[id]||{attempts:0,correct:0,lastCorrect:null}}

function nextPractice(){const p=state.practice;if(!p||!p.revealed)return;if(p.index===p.ids.length-1){p.finished=true;save();setView('practiceDone');return}p.index++;p.selected=null;p.revealed=false;save();practice();goTop()}
function topicSelection(pool,count){let groups={};for(const q of pool)(groups[q.topic]??=[]).push(q);let ids=[],topicOrder=shuf(Object.keys(groups));for(let topic of topicOrder){if(ids.length>=count)break;ids.push(shuf(groups[topic])[0].id)}if(ids.length<count){let rest=shuf(pool.filter(q=>!ids.includes(q.id)).map(q=>q.id));ids.push(...rest.slice(0,count-ids.length))}return ids}
function examSetup(){const e=state.exam,resume=e&&!e.finished;main.innerHTML=head('EXAM ROOM / 10 QUESTIONS','จำลองควิซ 10 ข้อ','โจทย์ 4 ตัวเลือก ไม่มีข้อซ้ำในชุด และแสดงเฉลยหลังส่งคำตอบ')+`<section class="source-card"><h2>ตั้งค่าชุดสอบ</h2><div class="setup"><label>เนื้อหาที่ออก<select id="exam-chapter"><option value="all">ผสม 9.1 + 9.2 (อย่างละ 5 ข้อ)</option><option value="9.1">เฉพาะ 9.1</option><option value="9.2">เฉพาะ 9.2</option></select></label><label>เวลาฝึก<select id="exam-minutes"><option value="0">ไม่จับเวลา</option><option value="15">15 นาที</option><option value="20">20 นาที</option><option value="30">30 นาที</option></select></label></div><div class="notice">ระบบเลือกหัวข้อให้หลากหลายภายในชุด · เวลาเป็นตัวเลือกสำหรับฝึก ไม่ใช่เวลาสอบจริงที่ยืนยันแล้ว</div>${resume?`<p>มีชุดสอบที่ยังทำไม่เสร็จ (${Object.keys(e.answers).length}/10 ข้อ)${e.deadline?' · เวลายังคงเดินขณะพัก':''}</p><div class="actions"><button class="primary" data-action="resumeExam">ทำชุดเดิมต่อ →</button><button class="secondary" data-action="restartExam">เริ่มชุดใหม่</button></div>${confirmRestart?'<div class="warning">เริ่มชุดใหม่จะเขียนทับชุดสอบที่ยังไม่ส่ง <div class="actions"><button class="primary btn-sm" data-action="confirmRestartExam">ยืนยันเริ่มชุดใหม่</button><button class="secondary btn-sm" data-action="cancelRestart">ยกเลิก</button></div></div>':''}`:'<button class="primary" data-action="beginExam">เริ่มจำลองสอบ →</button>'}</section>${sourceNote()}`}
function beginExam(){let ch=$('#exam-chapter')?.value||'all',minutes=Number($('#exam-minutes')?.value||0),ids;
 if(ch==='all'){ids=[...topicSelection(QUESTIONS.filter(q=>q.chapter==='9.1'),5),...topicSelection(QUESTIONS.filter(q=>q.chapter==='9.2'),5)]}else ids=topicSelection(QUESTIONS.filter(q=>q.chapter===ch),10);
 ids=shuf(ids);state.exam={ids,orders:Object.fromEntries(ids.map(id=>[id,shuf([0,1,2,3])])),answers:{},index:0,chapter:ch,started:Date.now(),deadline:minutes?Date.now()+minutes*60000:null,finished:false};confirmRestart=false;confirmExamSubmit=false;save();setView('exam');}
function exam(){clearInterval(timer);const e=state.exam;if(!e){setView('examSetup');return}if(e.finished){setView('result');return}if(e.deadline&&Date.now()>=e.deadline){finishExam();return}const q=find(e.ids[e.index]),selected=e.answers[q.id]??null,answered=Object.keys(e.answers).length;
main.innerHTML=`<div class="page-head flex-between"><div><div class="eyebrow">EXAM ROOM / QUESTION ${e.index+1} OF 10</div><h1>จำลองควิซ</h1></div><button class="secondary btn-sm" data-view="home">พักก่อน</button></div><div class="practice-layout"><section class="question-card">${questionUI(q,e.orders[q.id],selected,false,{exam:true})}<div class="exam-actions"><button class="secondary" data-action="examPrev" ${e.index===0?'disabled':''}>← ก่อนหน้า</button>${e.index<e.ids.length-1?'<button class="primary" data-action="examNext">ข้อถัดไป →</button>':'<button class="primary" data-action="askSubmit">ตรวจและส่งชุด →</button>'}</div>${confirmExamSubmit?`<div class="warning exam-warning">${answered<10?`ยังไม่ได้ตอบ ${10-answered} ข้อ ข้อที่ข้ามจะนับเป็น 0 คะแนน`: 'ตอบครบแล้ว พร้อมส่งคำตอบ'}<div class="actions"><button class="primary btn-sm" data-action="confirmSubmit">ยืนยันส่งคำตอบ</button><button class="secondary btn-sm" data-action="cancelSubmit">กลับไปตรวจ</button></div></div>`:''}</section><aside><section class="side-card">${e.deadline?'<div class="micro">เวลาที่เหลือ</div><div class="timer" id="timer"></div>':'<h3>ไม่จับเวลา</h3>'}<div class="side-row"><span>ตอบแล้ว</span><b>${answered}/10</b></div><div class="bar"><span style="width:${answered*10}%"></span></div><div class="exam-nav" aria-label="ไปยังข้อสอบ">${e.ids.map((id,i)=>`<button class="qnum ${e.answers[id]!==undefined?'answered':''} ${i===e.index?'current':''}" data-action="jumpExam" data-index="${i}" aria-label="ข้อ ${i+1}${e.answers[id]!==undefined?' ตอบแล้ว':''}" ${i===e.index?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><button style="margin-top:22px;width:100%" class="secondary" data-action="askSubmit">ส่งคำตอบ</button><p class="micro">${e.deadline?'เวลายังเดินเมื่อพักหรือปิดหน้าเว็บ':'พักและกลับมาทำต่อได้บนอุปกรณ์นี้'}</p></section></aside></div>`;if(e.deadline){tick();if(!e.finished)timer=setInterval(tick,1000)}}
function tick(){const e=state.exam;if(!e||e.finished)return;const left=Math.max(0,Math.ceil((e.deadline-Date.now())/1000)), el=$('#timer');if(el)el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(!left){clearInterval(timer);finishExam()}}
function finishExam(){const e=state.exam;if(!e||e.finished)return;e.finished=true;e.score=0;for(const id of e.ids){const answer=e.answers[id];if(answer!==undefined){const ok=answer===find(id).correct;record(id,ok);if(ok)e.score++}}save();confirmExamSubmit=false;reviewFilter='all';setView('result')}
function result(){const e=state.exam;if(!e||!e.finished){setView('examSetup');return}let answered=Object.keys(e.answers).length;let qs=e.ids.map((id,i)=>({q:find(id),n:i+1,ans:e.answers[id]??null}));if(reviewFilter==='wrong')qs=qs.filter(x=>x.ans!==x.q.correct);main.innerHTML=`<section class="result-hero"><div class="eyebrow">QUIZ COMPLETE / REVIEW YOUR REASONING</div><h1>จบชุดจำลองสอบแล้ว</h1><div class="score">${e.score}<small> / ${e.ids.length}</small></div><p>ตอบแล้ว ${answered}/${e.ids.length} ข้อ · คำตอบที่ข้ามนับ 0 คะแนน</p><div class="actions"><button class="primary" data-view="examSetup">ทำชุดใหม่ →</button><button class="secondary" data-view="home">กลับภาพรวม</button></div></section><div class="section-title"><h2>ทบทวนเฉลยทุกข้อ</h2><div class="actions"><button class="${reviewFilter==='all'?'primary':'secondary'} btn-sm" data-action="reviewFilter" data-filter="all">ทุกข้อ</button><button class="${reviewFilter==='wrong'?'primary':'secondary'} btn-sm" data-action="reviewFilter" data-filter="wrong">ผิด / ข้าม</button></div></div>${qs.length?qs.map(({q,n,ans})=>`<article class="review-item"><div class="question-meta"><span class="tag">ข้อ ${n} · ${esc(q.topic)}</span><span class="micro">${esc(q.id)} · ${esc(q.origin)}</span></div><h3 class="result-question">${esc(q.question)}</h3><p class="review-choice">คำตอบของคุณ: <b>${ans===null?'ยังไม่ได้ตอบ':esc(q.options[ans])}</b></p>${feedback(q,ans)}</article>`).join(''):'<div class="empty">ไม่มีข้อผิดหรือข้ามในชุดนี้</div>'}`}
function bank(){main.innerHTML=head('QUESTION BANK / QUICK REVIEW','คลังข้อสอบ','ค้นหาโจทย์ด้วยคีย์เวิร์ด กรองตามบทหรือหัวข้อ แล้วเปิดดูเฉลยได้ทันที')+`<div class="filters"><input id="bank-query" type="search" placeholder="ค้นหาโจทย์ เช่น nominal, เงินเฟ้อ, gradient" value="${esc(bankFilter.query)}" aria-label="ค้นหาโจทย์"><select id="bank-chapter" aria-label="กรองตามบท"><option value="all">ทุกบท</option><option value="9.1" ${bankFilter.chapter==='9.1'?'selected':''}>9.1</option><option value="9.2" ${bankFilter.chapter==='9.2'?'selected':''}>9.2</option></select><select id="bank-topic" aria-label="กรองตามหัวข้อ"><option value="all">ทุกหัวข้อ</option>${topics().map(t=>`<option value="${esc(t)}" ${bankFilter.topic===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="actions" style="margin-bottom:10px"><button class="secondary btn-sm" data-action="bankWeak">เฉพาะข้อที่ยังผิด</button><button class="secondary btn-sm" data-action="bankSaved">เฉพาะข้อที่บันทึก</button><button class="text-link" data-action="bankReset">ล้างตัวกรอง</button></div><div id="bank-results"></div>`;fillBank()}
let bankSpecial='all';
function fillBank(){const target=$('#bank-results');if(!target)return;const text=bankFilter.query.trim().toLowerCase();let pool=QUESTIONS.filter(q=>(bankFilter.chapter==='all'||q.chapter===bankFilter.chapter)&&(bankFilter.topic==='all'||q.topic===bankFilter.topic)&&(!text||[q.question,q.topic,q.ref,q.options.join(' '),q.why].join(' ').toLowerCase().includes(text))&&(bankSpecial==='all'||(bankSpecial==='weak'&&stat(q.id).lastCorrect===false)||(bankSpecial==='saved'&&state.bookmarks.includes(q.id))));target.innerHTML=`<p class="bank-count">พบ ${pool.length} จาก ${QUESTIONS.length} ข้อ${bankSpecial==='weak'?' · เฉพาะข้อที่ตอบผิดล่าสุด':bankSpecial==='saved'?' · เฉพาะข้อที่บันทึก':''}</p>${pool.length?pool.map(q=>`<article class="bank-row"><div class="question-meta"><span class="tag">${esc(q.chapter)} · ${esc(q.topic)}</span><span class="micro">${q.id} · ${esc(q.origin)}</span></div><h3>${esc(q.question)}</h3><details><summary>ดูเฉลยและวิธีคิด</summary>${feedback(q,null,true)}</details><button class="bookmark ${state.bookmarks.includes(q.id)?'on':''}" data-action="bookmarkBank" data-id="${q.id}">${state.bookmarks.includes(q.id)?'★ บันทึกแล้ว':'☆ บันทึก'}</button><button class="text-link" data-action="singlePractice" data-id="${q.id}">ฝึกข้อนี้ →</button></article>`).join(''):'<div class="empty">ไม่พบข้อที่ตรงกับตัวกรอง ลองคำค้นอื่น</div>'}`}
function render(){switch(view){case 'home':return home();case 'learn':return learn();case 'lesson':return lesson();case 'practiceStart':return practiceStart();case 'practice':return practice();case 'practiceDone':return practiceDone();case 'examSetup':return examSetup();case 'exam':return exam();case 'result':return result();case 'bank':return bank();default:view='home';return home()}}
document.addEventListener('click',e=>{
 const viewEl=e.target.closest('[data-view]');if(viewEl){e.preventDefault();setView(viewEl.dataset.view);return}
 const choice=e.target.closest('[data-choice]');if(choice){const value=Number(choice.dataset.choice);if(view==='practice'){const p=state.practice;if(!p.revealed){p.selected=value;save();practice()}}else if(view==='exam'){const ex=state.exam;if(ex&&!ex.finished){ex.answers[ex.ids[ex.index]]=value;save();exam()}}return}
 const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id;
 switch(action){
 case 'openLesson': if(LESSONS.some(l=>l.id===id)){lessonId=id;setView('lesson')}break;
 case 'markLesson':if(state.learned.includes(id))state.learned=state.learned.filter(x=>x!==id);else state.learned.push(id);save();lesson();toast(state.learned.includes(id)?'บันทึกว่าอ่านจบแล้ว':'ยกเลิกเครื่องหมายอ่านจบ');break;
 case 'lessonPractice':startPractice('topic','all',el.dataset.topic);break;
 case 'beginPractice':startPractice(el.dataset.mode,$('#practice-chapter')?.value||'all');break;
 case 'confirmPracticeReset':if(pendingPractice){const p=pendingPractice;startPractice(p.mode,p.chapter,p.topic,true,p.singleId||'')}break;
 case 'cancelPracticeReset':confirmPracticeReset=false;pendingPractice=null;practiceStart();break;
 case 'resumePractice':confirmPracticeReset=false;setView('practice');break;
 case 'practiceCheck':checkPractice();break;
 case 'practiceNext':nextPractice();break;
 case 'bookmark':case 'bookmarkBank':if(state.bookmarks.includes(id))state.bookmarks=state.bookmarks.filter(x=>x!==id);else state.bookmarks.push(id);save();if(action==='bookmark'&&view==='practice')practice();else if(view==='bank')fillBank();toast(state.bookmarks.includes(id)?'บันทึกข้อนี้แล้ว':'นำออกจากรายการบันทึก');break;
 case 'beginExam':beginExam();break;
 case 'resumeExam':confirmRestart=false;setView('exam');break;
 case 'restartExam':confirmRestart=true;examSetup();break;
 case 'confirmRestartExam':beginExam();break;
 case 'cancelRestart':confirmRestart=false;examSetup();break;
 case 'examPrev':if(state.exam.index>0)state.exam.index--;confirmExamSubmit=false;save();exam();goTop();break;
 case 'examNext':if(state.exam.index<state.exam.ids.length-1)state.exam.index++;confirmExamSubmit=false;save();exam();goTop();break;
 case 'jumpExam':state.exam.index=Number(el.dataset.index);confirmExamSubmit=false;save();exam();goTop();break;
 case 'askSubmit':confirmExamSubmit=true;exam();document.querySelector('.exam-warning')?.scrollIntoView({behavior:'smooth',block:'nearest'});break;
 case 'cancelSubmit':confirmExamSubmit=false;exam();break;
 case 'confirmSubmit':finishExam();break;
 case 'reviewFilter':reviewFilter=el.dataset.filter;result();break;
 case 'bankWeak':bankSpecial=bankSpecial==='weak'?'all':'weak';fillBank();break;
 case 'bankSaved':bankSpecial=bankSpecial==='saved'?'all':'saved';fillBank();break;
 case 'bankReset':bankFilter={query:'',chapter:'all',topic:'all'};bankSpecial='all';bank();break;
 case 'singlePractice':startPractice('single','all','',false,id);break;
 }
});
document.addEventListener('change',e=>{if(e.target.id==='lesson-select'){lessonId=e.target.value;setView('lesson')}else if(e.target.id==='bank-chapter'){bankFilter.chapter=e.target.value;fillBank()}else if(e.target.id==='bank-topic'){bankFilter.topic=e.target.value;fillBank()}});
document.addEventListener('input',e=>{if(e.target.id==='bank-query'){bankFilter.query=e.target.value;fillBank()}});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(view==='practice'&&!e.altKey&&!e.ctrlKey&&!e.metaKey){const p=state.practice;if(!p)return;if(!p.revealed&&/^[1-4]$/.test(e.key)){p.selected=p.orders[p.ids[p.index]][Number(e.key)-1];save();practice()}else if(e.key==='Enter'&&(document.activeElement===main||document.activeElement===document.body)){e.preventDefault();p.revealed?nextPractice():checkPractice()}}});
$('#update').addEventListener('click',()=>{const url=new URL(location.href);url.searchParams.set('refresh',String(Date.now()));location.replace(url.toString())});
setView('home',{focus:false});
</script>
</body></html>
