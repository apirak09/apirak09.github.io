<script>const LESSONS = [
{id:'foundations', chapter:'9.1', title:'เริ่มจาก Time Value of Money', topic:'มูลค่าเงินตามเวลา', pages:'9.1 หน้า 5–7, 30–31', read:'6 นาที', html:`
<p>เงินจำนวนเท่ากันที่ได้รับคนละเวลาไม่ได้มีมูลค่าทางเศรษฐกิจเท่ากันโดยอัตโนมัติ เพราะเงินวันนี้สามารถนำไปลงทุนเพื่อรับผลตอบแทนได้ เวลาจะเทียบทางเลือกต้องย้ายทุกจำนวนไปยังเวลาเดียวกันก่อน</p>
<div class="formula"><b>สัญลักษณ์ที่ต้องรู้</b><br>P = เงินปัจจุบัน / เงินก้อนต้นทาง<br>F = เงินก้อน ณ เวลาปลายทาง<br>A = เงินจำนวนเท่ากันในแต่ละงวด<br>i = อัตราดอกเบี้ยที่แท้จริงต่องวด<br>n = จำนวนงวด &nbsp; G = จำนวนที่เพิ่มขึ้นเท่า ๆ กันต่องวด</div>
<h3>ตัวอย่าง: 930 วันนี้ หรือ 1,000 สิ้นปี?</h3><ol><li>กำหนด i = 7% ต่อปี และนำทั้งสองตัวเลือกไปเทียบที่สิ้นปี</li><li>930 วันนี้มีมูลค่าสิ้นปี = 930(1.07) = <b>995.10</b> บาท</li><li>เปรียบเทียบ 995.10 กับ 1,000 บาท จึงเลือกรับ 1,000 สิ้นปี เมื่อความเสี่ยงและเงื่อนไขอื่นเท่ากัน</li></ol>
<div class="tip"><b>จุดสำคัญ</b> Economic equivalence คือมูลค่าเทียบเท่าที่อัตราและเวลาที่กำหนด ตัวเลขเงินอาจไม่เท่ากัน เช่น 100 วันนี้ เทียบเท่า 110 สิ้นปีที่ 1 เมื่อ i = 10%</div>`},
{id:'interest', chapter:'9.1', title:'ดอกเบี้ยอย่างง่ายและทบต้น', topic:'ดอกเบี้ยอย่างง่ายและทบต้น', pages:'9.1 หน้า 8–14', read:'8 นาที', html:`
<p><b>Simple interest</b> คิดดอกเบี้ยจากเงินต้นเริ่มต้นตลอด ส่วน <b>compound interest</b> นำดอกเบี้ยที่เกิดแล้วไปรวมในฐานของงวดถัดไป</p>
<div class="formula">Simple: I = Pin &nbsp; และ &nbsp; F = P(1 + in)<br>Compound: F = P(1+i)ⁿ &nbsp; และ &nbsp; P = F/(1+i)ⁿ</div>
<h3>ตัวอย่างเปรียบเทียบ</h3><p>ฝาก 10,000 บาท ดอกเบี้ย 8% ต่อปี 3 ปี</p><ol><li>Simple: F = 10,000[1 + (0.08)(3)] = <b>12,400</b> บาท</li><li>Compound รายปี: F = 10,000(1.08)³ = <b>12,597.12</b> บาท</li><li>ส่วนต่างเกิดจากดอกเบี้ยที่ถูกนำไปทบในงวดต่อไป</li></ol>
<h3>ย้อนหา P, i หรือ n</h3><p>P = F/(1+i)ⁿ; i = (F/P)^(1/n) − 1; n = ln(F/P)/ln(1+i) โดยต้องใช้ i และ n ในหน่วยเวลาเดียวกัน</p>
<p>ถ้าอัตราแต่ละปีเปลี่ยน ให้คูณแยก: F = P(1+i₁)(1+i₂)…(1+iₙ) เช่น 5%, 8%, 3% ใช้ 1.05 × 1.08 × 1.03</p>
<div class="tip">ถ้าโจทย์ไม่ชัดว่าดอกเบี้ยทบต้นหรือไม่ ควรดูเงื่อนไขหรือสมมติฐานที่ผู้สอนกำหนด ไม่ควรใช้ simple แทน compound โดยไม่บอก</div>`},
{id:'single-sum', chapter:'9.1', title:'ย้ายเงินก้อนระหว่าง P และ F', topic:'เงินก้อนเดียว P–F', pages:'9.1 หน้า 11–14, 25; ข้อสอบ 2025 ข้อ 16, 23', read:'7 นาที', html:`
<p>เงินก้อนเดียวใช้ F/P เมื่อย้ายไปอนาคต และ P/F เมื่อย้ายกลับอดีต โดย n คือจำนวนงวดระหว่างสองจุดเวลาจริง</p><div class="formula">F = P(F/P,i,n) = P(1+i)ⁿ<br>P = F(P/F,i,n) = F/(1+i)ⁿ</div>
<h3>ตัวอย่าง 1: ต้องการ 100,000 บาทในอีก 5 ปี</h3><ol><li>รู้ F = 100,000, i = 4% ต่อปี, n = 5; ต้องการ P ที่ t=0</li><li>P = 100,000/(1.04)⁵ = <b>82,192.71 บาท</b> หรือประมาณ 82,190 บาทตามช้อยส์</li></ol>
<h3>ตัวอย่าง 2: เปลี่ยนหน่วยการทบต้น</h3><p>F = 21,500 หลัง 10 ปี, nominal 10% ต่อปี ทบปีละ 2 ครั้ง: i = 0.10/2 = 5% ต่อครึ่งปี และ n = 10×2 = 20 งวด ดังนั้น P = 21,500/(1.05)²⁰ ≈ <b>8,103.12 บาท</b></p><div class="tip">ตรวจคำตอบ: เมื่อ i เป็นบวกและ F อยู่ในอนาคต ค่า P ต้องน้อยกว่า F</div>`},
{id:'rates', chapter:'9.1', title:'Nominal, effective และหน่วยเวลา', topic:'Nominal & effective rate', pages:'9.1 หน้า 15–19, 25–27', read:'10 นาที', html:`
<p>Nominal annual rate (j) เป็นอัตราที่อ้างเป็นรายปี ส่วน effective rate บอกการเติบโตจริงในช่วงที่กำหนดหลังคิดผลของการทบต้น <b>ต้องบอกด้วยว่า effective ต่อเดือน ต่อครึ่งปี หรือต่อปี</b></p>
<div class="formula">อัตราต่องวด = j/m<br>Effective ต่อปี = (1 + j/m)ᵐ − 1<br>Nominal ต่อปีจาก effective = m[(1+i<sub>eff</sub>)<sup>1/m</sup> − 1]<br>F = P(1+j/m)^(m × จำนวนปี)</div>
<p>m คือจำนวนงวดทบต้นต่อปี เช่น รายเดือน m=12, รายไตรมาส m=4, ครึ่งปี m=2</p>
<h3>ตัวอย่าง 12% nominal ทบต้นรายเดือน</h3><ol><li>ต่อเดือน i = 0.12/12 = 0.01 = 1%</li><li>หนึ่งปีมี 12 งวด: i<sub>eff</sub> = (1.01)¹² − 1 = <b>12.6825% ต่อปี</b></li><li>ถ้าจ่ายรายเดือน 5 ปี ให้ใช้ i = 1% ต่อเดือน และ n = 60 เดือนในสูตร annuity</li></ol>
<h3>โจทย์ย้อนกลับ</h3><p>Effective 12% ต่อปี ทบต้นรายไตรมาส: j = 4[(1.12)^(1/4) − 1] = <b>11.49% nominal ต่อปี</b></p>
<div class="tip"><b>กับดัก:</b> 9% nominal ต่อปี ทบไตรมาส จะได้ effective ต่อครึ่งปี = (1+0.09/4)²−1 = 4.5506% ไม่ใช่ 9% และไม่ใช่แค่ 9%/2 แบบไม่ทบ</div>`},
{id:'continuous-interest', chapter:'9.1', title:'ทบต้นต่อเนื่อง', topic:'ดอกเบี้ยต่อเนื่อง', pages:'9.1 หน้า 20–24', read:'5 นาที', html:`
<p>เมื่อจำนวนครั้งที่ทบต้นในหนึ่งปีเพิ่มมากขึ้นเรื่อย ๆ สูตร discrete จะเข้าใกล้ลิมิตของการทบต้นต่อเนื่อง</p>
<div class="formula">F = Peʳᵗ<br>Effective ต่อปี = eʳ − 1<br>r = nominal rate ต่อปีแบบทบต้นต่อเนื่อง, t = จำนวนปี</div>
<h3>ตัวอย่าง</h3><p>ทบต้นต่อเนื่องที่ nominal 20% ต่อปี: effective ต่อปี = e<sup>0.20</sup> − 1 = <b>22.14%</b> การหาเงินก้อนหลัง 3 ปีใช้ e<sup>0.20×3</sup></p>
<div class="tip">การทบต้นต่อเนื่องเป็นเรื่อง <b>วิธีคิดดอกเบี้ย</b> ส่วนกระแสเงินสดต่อเนื่องเป็นเรื่อง <b>เวลาในการรับหรือจ่ายเงิน</b> ทั้งสองแนวคิดไม่จำเป็นต้องเกิดพร้อมกัน</div>`},
{id:'inflation', chapter:'9.1', title:'เงินเฟ้อ ดัชนีราคา และกำลังซื้อ', topic:'เงินเฟ้อและกำลังซื้อ', pages:'9.1 หน้า 32–45', read:'9 นาที', html:`
<p>เงินเฟ้อคือระดับราคาสินค้าและบริการโดยทั่วไปเพิ่มขึ้น ทำให้เงินจำนวนเดิมซื้อของได้โดยเฉลี่ยน้อยลง หากอัตราเงินเฟ้อชะลอจาก 6% เหลือ 2% ระดับราคายังเพิ่ม แต่เพิ่มช้าลง ส่วนเงินฝืดคือระดับราคาโดยทั่วไปลดลง</p>
<p><b>Demand-pull:</b> อุปสงค์รวมดันราคา; <b>Cost-push:</b> ต้นทุนผลิตสูงขึ้นแล้วส่งผ่านเข้าสู่ราคา</p>
<div class="formula">ราคาในปี n = ราคาเริ่มต้น × (1+f)ⁿ<br>f เฉลี่ยต่อปี = (ดัชนีปลายงวด/ดัชนีต้นงวด)^(1/n) − 1<br>มูลค่ากำลังซื้อวันนี้ของ F = F/(1+f)ⁿ</div>
<h3>ตัวอย่าง CEPCI</h3><p>ดัชนีจาก 359 เป็น 402 ใน 10 ปี: f = (402/359)^(1/10)−1 = <b>1.14% ต่อปี</b> โดยเป็นอัตราเฉลี่ยแบบทบต้น</p>
<p><b>CPI</b> อ้างอิงตะกร้าสินค้าและบริการผู้บริโภค; <b>CEPCI</b> ใช้ติดตามต้นทุนที่เกี่ยวกับโรงงานเคมี จึงเลือกให้ตรงกับปัญหา ตามสไลด์ Core CPI ของไทยหักหมวดอาหารสดและพลังงานออกจาก CPI ทั่วไป</p>
<div class="tip">ราคาขึ้นสองเท่าใน 10 ปีหมายถึง (1+f)¹⁰=2 จึง f≈7.18% ไม่ใช่ 10% เพราะมีการทบต้น</div>`},
{id:'real-return', chapter:'9.1', title:'ผลตอบแทนหลังหักเงินเฟ้อ', topic:'เงินเฟ้อและกำลังซื้อ', pages:'9.1 หน้า 45–47', read:'6 นาที', html:`
<p>อัตราผลตอบแทนที่เห็นเป็นตัวเงินต้องนำมาเปรียบเทียบกับอัตราเงินเฟ้อในช่วงเดียวกัน เพื่อประเมินกำลังซื้อที่เพิ่มขึ้นจริง</p>
<div class="formula">1 + i<sub>real</sub> = (1 + i<sub>effective</sub>)/(1 + f)<br>i<sub>real</sub> ≈ i<sub>effective</sub> − f เป็นเพียงค่าประมาณ</div>
<h3>ตัวอย่างจากสไลด์</h3><ol><li>Nominal 12% ต่อปี ทบรายเดือน → i<sub>eff</sub> = (1+0.12/12)¹²−1 = 12.6825% ต่อปี</li><li>เงินเฟ้อ f = 6% ต่อปี</li><li>i<sub>real</sub> = 1.126825/1.06 − 1 = <b>6.30% ต่อปี</b></li></ol>
<div class="tip">อย่าเทียบ 1% ต่อเดือนกับเงินเฟ้อ 6% ต่อปีโดยตรง และอย่าเรียก 12−6=6% ว่าคำตอบ exact ในกรณีนี้</div>`},
{id:'diagram', chapter:'9.2', title:'อ่าน Cash Flow Diagram', topic:'แผนภาพกระแสเงินสด', pages:'9.2 หน้า 1–9', read:'7 นาที', html:`
<p>แกนนอนคือเวลา t=0,1,2,… และลูกศรบอกกระแสเงินสดในแต่ละเวลา เลือกมุมมองก่อนเสมอ: เงินเข้าสู่ระบบที่เลือกเป็นบวก และเงินออกเป็นลบ</p>
<h3>ตัวอย่างเงินกู้ 20,000</h3><p>มุมมองผู้กู้: ได้เงิน +20,000 ณ t=0 และจ่ายค่างวดเป็นลบ ส่วนมุมมองธนาคารกลับเครื่องหมาย การเปรียบเทียบเงินต่างเวลาต้องนำไปยังจุดเดียวกันก่อน</p>
<div class="formula">มูลค่าที่เวลา T = Σ CF<sub>t</sub>(1+i)^(T−t)<br>NPV ที่เวลา 0 = CF₀ + CF₁/(1+i) + CF₂/(1+i)² + …</div>
<p><b>Discrete:</b> จ่ายเป็นจุดเวลา เช่น สิ้นเดือน <b>Continuous:</b> เงินไหลตลอดช่วง โดยการทบต้นและการไหลเป็นคนละเรื่อง</p>
<div class="tip">ถ้าเป็นเงินวันนี้ CF₀ ไม่ต้อง discount; สำหรับเงินที่อยู่ t=2 แล้วต้องการ t=5 ให้ใช้จำนวนงวด 5−2=3</div>`},
{id:'factors', chapter:'9.2', title:'เลือก Factor ให้ถูกทิศ', topic:'ปัจจัย P/F และ F/P', pages:'9.2 หน้า 13–16', read:'9 นาที', html:`
<p>อ่าน (สิ่งที่อยากหา / สิ่งที่รู้, i, n) เช่น (P/F,8%,3) หมายถึงตัวคูณหา P เมื่อรู้ F ที่อัตรา 8% และ 3 งวด</p>
<div class="table-wrap"><table><thead><tr><th>ต้องการจากสิ่งที่รู้</th><th>สูตร factor</th><th>ความหมาย</th></tr></thead><tbody>
<tr><td>F จาก P</td><td>F/P = (1+i)ⁿ</td><td>ทบเงินก้อนไปอนาคต</td></tr><tr><td>P จาก F</td><td>P/F = (1+i)⁻ⁿ</td><td>คิดลดเงินก้อนมาปัจจุบัน</td></tr>
<tr><td>F จาก A</td><td>F/A = [(1+i)ⁿ−1]/i</td><td>รวมชุดเงินเท่ากันปลายงวดไป F</td></tr><tr><td>P จาก A</td><td>P/A = [1−(1+i)⁻ⁿ]/i</td><td>คิดลดชุดเงินเท่ากันไป P</td></tr>
<tr><td>A จาก P</td><td>A/P = i(1+i)ⁿ/[(1+i)ⁿ−1]</td><td>เงินก้อนเป็นค่างวด</td></tr><tr><td>A จาก F</td><td>A/F = i/[(1+i)ⁿ−1]</td><td>เงินฝากต่อปีเพื่อสะสม F</td></tr></tbody></table></div>
<p>คู่กลับที่ควรรู้: P/F = 1/(F/P), A/P = 1/(P/A), A/F = 1/(F/A) และ P/A = (F/A)(P/F) เมื่อ i,n ตรงกัน</p><div class="tip">เมื่อ i=0 อย่าหารด้วยศูนย์: ใช้ลิมิตหรือบวกกระแสทีละงวด เช่น P/A = n และ F/A = n</div>`},
{id:'annuity', chapter:'9.2', title:'Uniform Series และการเลื่อนเวลา', topic:'ชุดเงินเท่ากัน A', pages:'9.2 หน้า 10–15, 30', read:'10 นาที', html:`
<p>Ordinary annuity คือ A เท่ากันทุกสิ้นงวด โดย A แรกเกิดหนึ่งงวดหลังจุด P ส่วน F จาก F/A จะอยู่เวลาเดียวกับ A งวดสุดท้าย</p>
<div class="formula">F = A(F/A,i,n) &nbsp;&nbsp; P = A(P/A,i,n)<br>A = P(A/P,i,n) &nbsp;&nbsp; A = F(A/F,i,n)</div>
<h3>ตัวอย่าง: ฝาก 3,000 สิ้นปี 5 ครั้งที่ 6%</h3><ol><li>เป็นชุด A ปลายงวด ต้องการ F ที่ t=5 จึงใช้ F/A</li><li>F = 3,000[(1.06)⁵−1]/0.06 = <b>16,911.28 บาท</b></li></ol>
<h3>ชุดเริ่มช้า (deferred annuity)</h3><p>ถ้าได้รับ 1,000 ที่ t=3,4,5: P/A 3 งวดให้มูลค่า ณ t=2 ก่อน จากนั้นคิดลดสองงวด: P₀ = 1,000(P/A,10%,3)(P/F,10%,2) ≈ <b>2,055.25 บาท</b></p>
<h3>จ่ายต้นงวด</h3><p>หาก A ที่ t=0,1,2,3,4 แทน t=1,2,3,4,5 แล้วต้องการ F₅ ให้คูณ F/A ปกติอีก (1+i) เพราะเงินแต่ละก้อนได้ดอกเบี้ยเพิ่มหนึ่งงวด</p>
<div class="tip">ภาพในสไลด์แสดง A ที่ t=1,2,… จึงควรยึดตำแหน่งบน timeline เป็นหลัก หากคำบรรยายต้นงวด/ปลายงวดกำกวม</div>`},
{id:'loans', chapter:'9.2', title:'เงินกู้ ค่างวด และดอกเบี้ยรวม', topic:'เงินกู้และค่างวด', pages:'9.2 หน้า 19–24', read:'8 นาที', html:`
<p>เงินกู้ P วันนี้เท่ากับมูลค่าปัจจุบันของเงินผ่อน A เท่า ๆ กันทุกสิ้นงวด ดังนั้นเลือก <b>A/P</b> เพื่อหา A</p>
<div class="formula">A = P × i(1+i)ⁿ / [(1+i)ⁿ−1]<br>ดอกเบี้ยที่จ่ายรวมแบบตัวเงิน = A × n − P</div>
<h3>ตัวอย่างกู้ 20,000 ดอลลาร์</h3><ol><li>Nominal 8% ต่อปี ทบรายเดือน, ผ่อน 5 ปี → i = 0.08/12 ต่อเดือน, n = 60</li><li>A = 20,000(A/P, 0.08/12, 60) ≈ <b>405.53 ดอลลาร์ต่อเดือน</b></li><li>คิดจากค่างวดก่อนปัด: ดอกเบี้ยรวม = 60A − 20,000 ≈ <b>4,331.67 ดอลลาร์</b> การปัดค่างวดแต่ละเดือนอาจทำให้ต่างเล็กน้อย</li></ol>
<p>หนี้ก้อนเดียวกันยืดเวลาผ่อนมักทำให้ค่างวดลด แต่จ่ายดอกเบี้ยรวมมากขึ้น เพราะยอดคงค้างอยู่นานขึ้น</p>
<div class="tip">หากโจทย์จ่ายรายปีแต่ทบรายเดือน ให้แปลงเป็น effective รายปีก่อนใช้ factor แบบรายปี</div>`},
{id:'mixed', chapter:'9.2', title:'กระแสเงินสดไม่เท่ากันและ NPV', topic:'กระแสเงินสดหลายช่วงเวลา', pages:'9.2 หน้า 6–9, 17–18', read:'7 นาที', html:`
<p>ถ้าจำนวนเงินแต่ละปีไม่เท่ากัน ไม่ควรใช้ P/A ครอบทั้งหมดโดยไม่มีการแยกชุด ให้แปลงรายการทีละก้อนหรือแยกชุดที่เท่ากันก่อนรวม</p>
<h3>ตัวอย่างจากสไลด์</h3><p>ฝาก 5,000 ที่ t=0; 1,000 ที่ t=1; 2,000 ที่ t=3 และถอน 3,000 ที่ t=4; i = 8% ต้องการเงินที่ t=7</p><div class="formula">F₇ = 5,000(1.08)⁷ + 1,000(1.08)⁶<br>+ 2,000(1.08)⁴ − 3,000(1.08)³<br>= <b>9,097.84</b></div>
<p>แต่ละเลขชี้กำลังเท่ากับ 7−t ของรายการนั้น หากต้องการค่า ณ t=0 ให้หาร F₇ ด้วย (1.08)⁷ ได้ประมาณ <b>5,308.50</b></p>
<div class="tip">NPV = CF₀ + Σ CFₜ/(1+i)ᵗ เครื่องหมายต้องตรงมุมมองผู้ลงทุน และเงินเริ่มต้น CF₀ ไม่ต้องคิดลด</div>`},
{id:'gradient', chapter:'9.2', title:'Arithmetic Gradient: P/G และ A/G', topic:'Gradient และอนุกรมเพิ่ม', pages:'9.2 หน้า 31–39', read:'10 นาที', html:`
<p>Arithmetic gradient คือ cash flow เพิ่มหรือลดด้วย <b>จำนวนคงที่ G</b> แต่ละงวด ไม่ใช่เพิ่มคงที่เป็นร้อยละ แยกเป็น base A ที่เท่ากันทุกปี และส่วน gradient 0, G, 2G, …</p>
<div class="formula">P<sub>รวม</sub> = A<sub>base</sub>(P/A,i,n) + G(P/G,i,n)<br>P/G = [(1+i)ⁿ − in − 1] / [i²(1+i)ⁿ]<br>A<sub>รวม</sub> = A<sub>base</sub> + G(A/G,i,n)<br>A/G = 1/i − n/[(1+i)ⁿ−1]</div>
<h3>ตัวอย่าง</h3><p>ค่าใช้จ่าย 500, 600, …, 1,400 ดอลลาร์ ในปี 1–10, i=5%: base = 500 และ G=100</p><ol><li>P = 500(P/A,5%,10) + 100(P/G,5%,10)</li><li>ใช้ factor ไม่ปัดระหว่างทางได้ขนาดค่าใช้จ่าย <b>7,026.07 ดอลลาร์</b>; ถ้าเงินออกให้ใส่เครื่องหมายลบ</li><li>A = 500 + 100(A/G,5%,10) ≈ <b>909.91 ดอลลาร์/ปี</b></li></ol>
<div class="warning"><b>ตรวจหน่วยกับสไลด์:</b> หน้า 39 แสดง 7,026,050 และ 909,910 ดอลลาร์ แต่กราฟหน้า 37 ระบุ 500 ถึง 1,400 ดอลลาร์ หากตัวเลขกราฟเป็นหน่วยดอลลาร์ตามที่พิมพ์ คำตอบจะเป็น 7,026.07 และ 909.91 ดอลลาร์/ปี การปัด factor แบบในสไลด์ให้ประมาณ 7,026.05 จึงควรตรวจสอบหน่วยที่ผู้สอนตั้งใจ</div>
<p>ถ้าค่าใช้จ่าย <b>ลดลง</b> ปีละจำนวนเท่ากัน ให้ใช้ G ติดลบ เช่น 500,400,300,200 → G = −100</p>`},
{id:'continuous-flow', chapter:'9.2', title:'กระแสเงินสดต่อเนื่อง', topic:'กระแสเงินต่อเนื่อง', pages:'9.2 หน้า 27–29', read:'9 นาที', html:`
<p>ถ้าเงินไหลเข้าหรือออกสม่ำเสมอเป็นอัตรา C ต่อปีตลอดช่วงเวลา แต่ละส่วนได้รับดอกเบี้ยนานไม่เท่ากัน จึงต้องรวมผลตามเวลาจริง</p>
<div class="formula">เงินไหล C ระหว่าง t=a ถึง b และคิดที่ T ≥ b:<br>F<sub>T</sub> = C(e<sup>r(T−a)</sup> − e<sup>r(T−b)</sup>)/r<br>เงินไหล A ต่อเนื่อง 0 ถึง n: P = A(1−e⁻ʳⁿ)/r</div>
<h3>ตรวจตัวอย่างในสไลด์</h3><p>r=12% ต่อปี: ลงทุน 3 ล้านดอลลาร์/ปี ระหว่าง t=−2 ถึง −1 และ 7 ล้าน/ปี ระหว่าง −1 ถึง 0</p><ol><li>ช่วงแรก F₀ = 3(e<sup>0.24</sup>−e<sup>0.12</sup>)/0.12 = <b>3.5938 ล้าน</b></li><li>ช่วงที่สอง F₀ = 7(e<sup>0.12</sup>−1)/0.12 = <b>7.4373 ล้าน</b></li><li>รวมตาม timeline = <b>11.0311 ล้านดอลลาร์</b></li></ol>
<div class="warning">สไลด์หน้า 28 ระบุ 12.44 ล้าน แต่ตัวคูณในเฉลยดูเหมือนทบเพิ่มอีกหนึ่งปีเทียบกับช่วงที่วาด จึงได้ผลต่างจากการรวมตาม timeline นี้ ควรถามผู้สอนว่าตั้งใจใช้ช่วงเวลาใด</div>`},

{id:'depreciation-basics', chapter:'9.3', title:'รู้จักค่าเสื่อมราคาและมูลค่าบันทึก', topic:'พื้นฐานค่าเสื่อมราคา', pages:'9.3 · PDF หน้า 1–6; ข้อสอบ 2025 ข้อ 20', read:'9 นาที', html:`
<p><b>ค่าเสื่อมราคา (depreciation)</b> คือการกระจายต้นทุนสินทรัพย์ที่คิดค่าเสื่อมได้ตลอดอายุการใช้งาน เพื่อสะท้อนการใช้ประโยชน์ การสึกหรอ และความล้าสมัย ค่าเสื่อมเป็นค่าใช้จ่ายทางบัญชี ไม่ใช่เงินสดที่จ่ายซ้ำในปีนั้น การซื้อเครื่องจักรจ่ายเงินจริงตอนลงทุน</p>
<div class="formula">C = FCI<sub>L</sub> = ต้นทุนสินทรัพย์ที่คิดค่าเสื่อมได้ ไม่รวมที่ดิน<br>S = มูลค่าซากสุทธิ &nbsp; n = อายุที่คิดค่าเสื่อม &nbsp; d<sub>k</sub> = ค่าเสื่อมปี k<br>D = C − S &nbsp; และ &nbsp; BV<sub>k</sub> = C − Σd<sub>j</sub> ตั้งแต่ปี 1 ถึง k</div>
<h3>อะไรคิดค่าเสื่อมได้?</h3><p>เครื่องจักรและอาคารที่ใช้ประกอบธุรกิจเป็นตัวอย่างสินทรัพย์ที่อาจคิดค่าเสื่อมได้ ส่วน <b>ที่ดินและ working capital</b> ไม่รวมในฐานค่าเสื่อมตามสไลด์ ตัวอย่างนี้เป็นกรอบการเรียน ไม่ใช่การตัดสินสิทธิภาษีจริงซึ่งขึ้นกับเงื่อนไขและกฎหมายที่ใช้</p>
<h3>อย่าสับสนราคา 3 แบบ</h3><p><b>Book value (BV)</b> คือมูลค่าตามบัญชีหลังหักค่าเสื่อมสะสม; <b>market value</b> คือราคาซื้อขายในตลาด; <b>replacement value</b> คือค่าใช้จ่ายซื้อสินทรัพย์ทดแทนที่ทำงานได้เท่าเดิม ทั้งสามอาจไม่เท่ากัน</p>
<p><b>Salvage value</b> คือราคาขายซากหักค่ารื้อ ขนย้าย และขาย เช่น ขายได้ 30,000 แต่รื้อและขน 8,000 → S = 22,000 บาท ถ้าค่าใช้จ่ายมากกว่าราคาขาย S สุทธิอาจติดลบ</p>
<div class="tip">ค่าเสื่อมสะสมไม่ใช่ค่าเสื่อมของปีล่าสุด: ถ้า C = 100,000 และหักสะสมแล้ว 35,000 จะได้ BV = 65,000 บาท โดยราคาตลาดอาจต่างออกไป</div>`},
{id:'depreciation-straight', chapter:'9.3', title:'ค่าเสื่อมราคาแบบเส้นตรง (SL)', topic:'เส้นตรง SL', pages:'9.3 · PDF หน้า 7–8, 15–16; ข้อสอบ 2025 ข้อ 31', read:'8 นาที', html:`
<p>เมื่อโจทย์กำหนด <b>straight line</b> ให้เฉลี่ยฐานที่เสื่อมได้เท่ากันทุกปี เหมาะกับโจทย์ที่กำหนด C, S และ n และถามค่าเสื่อมรายปีหรือ BV สิ้นปี</p>
<div class="formula">d<sub>k</sub> = (C − S)/n<br>BV<sub>k</sub> = C − k d &nbsp;&nbsp; (k = 0 ถึง n)</div>
<h3>ตัวอย่างจากสไลด์</h3><ol><li>C = 22,000 บาท, S = 2,000 บาท, n = 10 ปี → ฐานที่เสื่อมได้ = 20,000 บาท</li><li>d = 20,000/10 = <b>2,000 บาทต่อปี</b> เท่ากันทุกปี</li><li>สิ้นปี 5 หักสะสม 5 × 2,000 = 10,000 บาท → BV₅ = 22,000 − 10,000 = <b>12,000 บาท</b></li><li>สิ้นปี 10: BV₁₀ = 2,000 บาท = S</li></ol>
<div class="tip">โจทย์ถามค่าเสื่อมปีที่ 5 ตอบ 2,000 แต่ถ้าถามค่าเสื่อมสะสม 5 ปีตอบ 10,000 และถ้าถาม BV ตอบ 12,000</div>`},
{id:'depreciation-syd', chapter:'9.3', title:'ผลรวมเลขปี (SOYD)', topic:'ผลรวมเลขปี SOYD', pages:'9.3 · PDF หน้า 9–12, 17', read:'9 นาที', html:`
<p><b>Sum of the years’ digits</b> แจกค่าเสื่อมมากในช่วงต้น แล้วลดลงตามอายุที่เหลือ คิดจากฐาน (C−S) คูณสัดส่วนของปีนั้น</p>
<div class="formula">ผลรวมเลขปี = 1+2+…+n = n(n+1)/2<br>d<sub>k</sub> = [(n−k+1) / {n(n+1)/2}](C−S)<br>BV<sub>k</sub> = C − (d₁ + … + d<sub>k</sub>)</div>
<h3>ตัวอย่าง C = 22,000, S = 2,000, n = 10</h3><ol><li>ฐานเสื่อมได้ = 20,000 บาท; ผลรวมเลขปี = 10×11/2 = 55</li><li>ปี 1 ใช้ 10/55 → d₁ = 3,636.36 บาท; ปี 2 ใช้ 9/55 → d₂ = 3,272.73 บาท</li><li>ปี 5 ใช้ 6/55 → d₅ = 2,181.82 บาท <b>ตัวเศษนับอายุที่เหลือรวมปีที่กำลังคิด</b></li><li>รวม 5 ปีแรก = (10+9+8+7+6)/55 × 20,000 = 14,545.45 บาท ดังนั้น BV₅ ≈ <b>7,454.55 บาท</b></li></ol>
<div class="tip">SOYD ลดลงด้วยจำนวนเงินเท่ากันในแต่ละปี เพราะเศษลดทีละ 1 ส่วน BV ต้องหักค่าเสื่อมของทุกปีสะสม ไม่ใช่หักเฉพาะปีที่ถาม</div>`},
{id:'depreciation-ddb', chapter:'9.3', title:'ยอดลดและยอดลดสองเท่า (DB / DDB)', topic:'ยอดลด DB และ DDB', pages:'9.3 · PDF หน้า 13–14, 18–19', read:'10 นาที', html:`
<p><b>Declining balance</b> ใช้อัตราคงที่คูณ <b>BV ต้นปี</b> จึงได้ค่าเสื่อมเป็นจำนวนเงินลดลงตามเวลาที่ยอดคงเหลือลดลง ส่วน DDB ใช้อัตรา 2/n ต่อปี</p>
<div class="formula">d<sub>k</sub> = r × BV<sub>k−1</sub>, &nbsp; BV<sub>k</sub> = BV<sub>k−1</sub> − d<sub>k</sub><br>DDB: r = 2/n &nbsp; (ก่อนต้องปรับให้เป็นไปตาม S)<br>ถ้าไม่ติดเพดาน: BV<sub>k</sub> = C(1−r)<sup>k</sup></div>
<h3>ตัวอย่างจากสไลด์: C = 150, S = 10 ล้านดอลลาร์, n = 7</h3><ol><li>r = 2/7 ≈ 28.5714% ของ BV ต้นปี ไม่ใช่ 2/7 ของ C−S</li><li>ปี 1: d₁ = (2/7)150 = <b>42.86 ล้าน</b>, BV₁ = 107.14 ล้าน</li><li>ปี 2: d₂ = (2/7)107.14 ≈ <b>30.61 ล้าน</b>; BV₂ ≈ 76.53 ล้าน ควรเก็บค่าก่อนปัดระหว่างทาง</li></ol>
<p>ถ้าโจทย์กำหนดอัตรา DB อื่น ให้ใช้ r ที่ระบุ เช่น 1.5/n แทน 2/n ค่า S ไม่ได้ถูกหักก่อนคูณอัตรา แต่ใช้จำกัดไม่ให้ BV ต่ำกว่า S</p>
<div class="warning"><b>ปีสุดท้ายต้องดูเงื่อนไข:</b> ห้ามหักเกินส่วน BV−S และหากโจทย์กำหนดให้ BV ปลายอายุเท่ากับ S ให้ปรับปีสุดท้ายเป็น BV ต้นปี − S แม้อาจมากกว่าสูตร DDB ปกติ สไลด์ยกตัวอย่างการปรับเช่นนี้; บางวิธีเปลี่ยนไปใช้ SL เมื่อเหมาะสม จึงต้องอ่านโจทย์ให้ชัด</div>`},
{id:'depreciation-macrs', chapter:'9.3', title:'MACRS และ half-year convention', topic:'MACRS', pages:'9.3 · PDF หน้า 20–22', read:'10 นาที', html:`
<p><b>MACRS</b> ในตัวอย่างสไลด์ใช้อัตราตามตารางของทรัพย์สินกลุ่มระยะกู้คืน 5 ปี โดยผสม DDB กับ SL และใช้ <b>half-year convention</b> จึงกระจายค่าเสื่อมเป็น 6 ปีภาษี สูตรและตารางอื่นต้องใช้เงื่อนไขที่โจทย์ให้</p>
<div class="table-wrap"><table><thead><tr><th>ปี</th><th>อัตรา</th><th>เมื่อ C = 150 ล้าน</th></tr></thead><tbody><tr><td>1</td><td>20%</td><td>30 ล้าน</td></tr><tr><td>2</td><td>32%</td><td>48 ล้าน</td></tr><tr><td>3</td><td>19.20%</td><td>28.80 ล้าน</td></tr><tr><td>4</td><td>11.52%</td><td>17.28 ล้าน</td></tr><tr><td>5</td><td>11.52%</td><td>17.28 ล้าน</td></tr><tr><td>6</td><td>5.76%</td><td>8.64 ล้าน</td></tr></tbody></table></div>
<p>ในตารางตัวอย่าง: d<sub>k</sub> = อัตราปีนั้น × <b>ต้นทุน C เดิม</b> ไม่ใช่คูณ BV เหลือ และไม่หัก S ออกจากฐาน อัตราทั้ง 6 ปีรวม 100% ของ C ส่วนมูลค่าซากทางเศรษฐกิจยังอาจมีอยู่แยกจาก BV ทางภาษี</p>
<h3>ทำไมปี 1 = 20%?</h3><p>DDB สำหรับ 5 ปีให้อัตราเต็มปี 2/5 = 40%; ครึ่งปีแรกจึงได้ 20% ต่อจากนั้นเปรียบเทียบ DDB กับ SL ของฐานเหลือตามเวลาที่เหลือ และเปลี่ยนเป็น SL เมื่อให้ค่าเสื่อมสูงกว่า และอาจเลือกเปลี่ยนเมื่อเท่ากันได้ ตัวอย่างในสไลด์ปี 4 ทั้งสองวิธีเท่ากันที่ 11.52% ของ C และเลือกใช้ SL ต่อจากนั้น</p>
<div class="tip">อย่าใช้ตารางนี้กับสินทรัพย์ทุกกลุ่มโดยอัตโนมัติ ถ้าโจทย์ระบุกลุ่ม ระยะ หรือ convention ต่างกัน ต้องใช้ตารางที่ตรงกับโจทย์</div>`},
{id:'depreciation-tax', chapter:'9.3', title:'ค่าเสื่อม ภาษี และกระแสเงินสด', topic:'ภาษีและกระแสเงินสด', pages:'9.3 · PDF หน้า 23; ข้อสอบ 2025 ข้อ 31', read:'10 นาที', html:`
<p>ถ้ารายรับและต้นทุนเงินสดของโจทย์เท่ากัน การลงค่าเสื่อมมากขึ้นทำให้กำไรก่อนภาษีน้อยลงและเกิด <b>tax shield</b> โดยต้องระวังไม่หักค่าเสื่อมซ้ำเมื่อโจทย์ให้ต้นทุนที่รวมค่าเสื่อมแล้ว</p>
<div class="formula">กำไรก่อนภาษี = รายรับ − ต้นทุนการผลิตที่ไม่รวมค่าเสื่อม − d<br>ภาษี = กำไรก่อนภาษี × อัตราภาษี (ตัวอย่างนี้สมมติกำไรเป็นบวก)<br>กำไรหลังภาษี = กำไรก่อนภาษี − ภาษี<br>กระแสเงินสดจากการดำเนินงานหลังภาษี = กำไรหลังภาษี + d</div>
<h3>ตัวอย่าง</h3><ol><li>รายรับ 7 ล้าน; ต้นทุนเงินสด 2 ล้าน; d = 1.95 ล้าน → กำไรก่อนภาษี = 7 − 2 − 1.95 = 3.05 ล้าน</li><li>ภาษี 30% = 3.05(0.30) = 0.915 ล้าน; กำไรหลังภาษี = 2.135 ล้าน</li><li>บวก d กลับเพราะไม่ใช่เงินสดที่จ่ายซ้ำ → cash flow = 2.135 + 1.95 = <b>4.085 ล้านต่อปี</b></li></ol>
<p>เมื่อหักได้เต็มจำนวนและมีกำไรเสียภาษีเพียงพอ tax shield เพิ่มจาก d คือ d × อัตราภาษี ค่าเสื่อมเร็วขึ้นทำให้ tax shield เกิดเร็วขึ้น ซึ่งมักมีมูลค่าปัจจุบันมากกว่าเมื่ออัตราคิดลดเป็นบวก ทั้งนี้ต้องดูข้อกำหนดและฐานที่โจทย์กำหนด</p>
<div class="tip">ถ้ากำไรก่อนภาษีติดลบ โจทย์ต้องบอกเงื่อนไขการใช้ขาดทุนภาษี อย่าสมมติว่าได้รับเงินคืนทันที</div>`},
{id:'depreciation-exam', chapter:'9.3', title:'เชื่อมโจทย์ปลายภาค 2025', topic:'โจทย์บูรณาการค่าเสื่อม', pages:'ข้อสอบ 2025 ข้อ 20 และข้อ 31 / 18.3; 9.3 · PDF หน้า 2, 7', read:'8 นาที', html:`
<p>โจทย์โรงงานในข้อสอบกำหนด FCI = 22 ล้านดอลลาร์ <b>รวมที่ดิน 2 ล้าน</b>, S = 0.5 ล้าน, n = 10 ปี, ใช้ SL และมี working capital แยกต่างหาก</p>
<ol><li>หา C หรือ FCI<sub>L</sub> ก่อน: 22 − 2 = <b>20 ล้านดอลลาร์</b> ไม่รวมที่ดินและ working capital ในฐานค่าเสื่อม</li><li>ค่าเสื่อมต่อปี = (20 − 0.5)/10 = <b>1.95 ล้านดอลลาร์/ปี</b></li><li>BV สิ้นปี 5 ของฐานที่คิดค่าเสื่อม = 20 − 5(1.95) = <b>10.25 ล้านดอลลาร์</b> ตรงกับจำนวนในเฉลย แต่หน่วยต้องเป็นล้านดอลลาร์ตามข้อมูล</li></ol>
<p>ในโจทย์เดียวกัน working capital เท่ากับ 10% ของ total capital investment ที่ไม่รวมที่ดิน จึงต้องตั้งสมการ WC = 0.10(20 + WC) ได้ WC ≈ 2.22 ล้าน แต่ไม่ได้เอา WC มาหาค่าเสื่อม คำถามแต่ละข้ออาจนิยามฐานหรือขอบเขตของ BV ต่างกัน ต้องอ่านให้ชัด</p>
<div class="tip">ลำดับทำโจทย์: แยกที่ดินและเงินทุนหมุนเวียน → ระบุ C, S, n → เลือกวิธี → หาค่าเสื่อมรายปี → สะสมถึงปีที่ถาม → หา BV หรือภาษี</div>`},

<script>// Safe arithmetic parser for the course calculator: no eval or network calls.
function calcGcd(a,b){a=a<0n?-a:a;b=b<0n?-b:b;while(b){const r=a%b;a=b;b=r}return a||1n}
function calcRational(n,d){if(d===0n)throw Error('หารด้วยศูนย์ไม่ได้');if(d<0n){n=-n;d=-d}if(n.toString().length>150||d.toString().length>150)return null;const g=calcGcd(n,d);return {n:n/g,d:d/g}}
function calcNumberFraction(raw){
 const m=raw.toLowerCase().match(/^(\d*\.?\d+|\d+\.)(?:e([+-]?\d+))?$/);if(!m)return null;
 const bits=m[1].split('.'),digits=(bits[0]||'0')+(bits[1]||''),exponent=Number(m[2]||0)-(bits[1]||'').length;
 if(digits.length>80||Math.abs(exponent)>80)return null;
 let n=BigInt(digits||'0'),d=1n;if(exponent>=0)n*=10n**BigInt(exponent);else d=10n**BigInt(-exponent);return calcRational(n,d);
}
function calcApply(op,a,b){
 let value,r=null;
 if(op==='+'){value=a.value+b.value;if(a.r&&b.r)r=calcRational(a.r.n*b.r.d+b.r.n*a.r.d,a.r.d*b.r.d)}
 else if(op==='-'){value=a.value-b.value;if(a.r&&b.r)r=calcRational(a.r.n*b.r.d-b.r.n*a.r.d,a.r.d*b.r.d)}
 else if(op==='*'){value=a.value*b.value;if(a.r&&b.r)r=calcRational(a.r.n*b.r.n,a.r.d*b.r.d)}
 else if(op==='/'){if(b.value===0)throw Error('หารด้วยศูนย์ไม่ได้');value=a.value/b.value;if(a.r&&b.r)r=calcRational(a.r.n*b.r.d,a.r.d*b.r.n)}
 else if(op==='^'){
  value=(a.value<0&&b.r&&b.r.d%2n===1n)?(b.r.n%2n===0n?1:-1)*Math.pow(-a.value,b.value):Math.pow(a.value,b.value);
  if(a.r&&b.r&&b.r.d===1n&&b.r.n>=-50n&&b.r.n<=50n){const n=b.r.n<0n?-b.r.n:b.r.n;const nn=a.r.n**n,dd=a.r.d**n;r=b.r.n<0n?calcRational(dd,nn):calcRational(nn,dd)}
 }
 if(!Number.isFinite(value))throw Error('ผลลัพธ์อยู่นอกช่วงที่คำนวณได้');
 if(r){const rn=Number(r.n),rd=Number(r.d);if(Number.isFinite(rn)&&Number.isFinite(rd))value=rn/rd}
 return {value,r};
}
function calculateExpression(input){
 const src=String(input).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').trim();if(!src)throw Error('กรุณาใส่ตัวเลข');if(src.length>300)throw Error('นิพจน์ยาวเกินไป');
 const tokens=[];let i=0;while(i<src.length){if(/\s/.test(src[i])){i++;continue}const chunk=src.slice(i),m=chunk.match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/);if(m){const v=Number(m[0]);if(!Number.isFinite(v))throw Error('ตัวเลขมากเกินไป');tokens.push({type:'number',text:m[0],value:v});i+=m[0].length;continue}if('+-*/^()'.includes(src[i])){tokens.push({type:src[i]});i++;continue}throw Error('มีสัญลักษณ์ที่เครื่องคิดเลขไม่รองรับ')}
 let at=0;const peek=()=>tokens[at]?.type;
 function primary(){const t=tokens[at];if(!t)throw Error('นิพจน์ยังไม่ครบ');if(t.type==='number'){at++;return {value:t.value,r:calcNumberFraction(t.text)}}if(t.type==='('){at++;const v=sum();if(peek()!==')')throw Error('วงเล็บยังไม่ครบ');at++;return v}throw Error('ตรวจตำแหน่งตัวเลขหรือเครื่องหมาย')}
 function power(){let v=primary();if(peek()==='^'){at++;v=calcApply('^',v,unary())}return v}
 function unary(){if(peek()==='+'||peek()==='-'){const op=tokens[at++].type,v=unary();if(op==='-')return {value:-v.value,r:v.r?{n:-v.r.n,d:v.r.d}:null};return v}return power()}
 function product(){let v=unary();while(peek()==='*'||peek()==='/'){let op=tokens[at++].type;v=calcApply(op,v,unary())}return v}
 function sum(){let v=product();while(peek()==='+'||peek()==='-'){let op=tokens[at++].type;v=calcApply(op,v,product())}return v}
 const result=sum();if(at!==tokens.length)throw Error('ตรวจตำแหน่งตัวเลขหรือวงเล็บ');if(!Number.isFinite(result.value))throw Error('ผลลัพธ์อยู่นอกช่วงที่คำนวณได้');return result;
}
function calcFormat(n){if(Object.is(n,-0)||n===0)return '0';return Number(n.toPrecision(12)).toString()}
function calcFractionText(r){if(!r||r.d===1n)return '';const text=`${r.n}/${r.d}`;return text.length<=60?text:''}
function calculatorMarkup(){return `<section id="calculator-panel" class="calculator-panel" aria-label="เครื่องคิดเลข" hidden><div class="calculator-head"><strong>เครื่องคิดเลข</strong><button type="button" class="calculator-close" data-calc-action="close" aria-label="ปิดเครื่องคิดเลข">×</button></div><label class="calc-expression-label" for="calc-expression">นิพจน์</label><input id="calc-expression" class="calc-expression" type="text" inputmode="none" autocomplete="off" spellcheck="false" aria-label="นิพจน์สำหรับคำนวณ" placeholder="เช่น (1+0.08)^5"><div class="calc-answer" id="calc-answer" role="status" aria-live="polite"><span>ผลลัพธ์จะแสดงที่นี่</span></div><div id="calc-fraction" class="calc-fraction" hidden><label>เศษ<input id="calc-numerator" type="number" inputmode="decimal" step="any" placeholder="1"></label><span>⁄</span><label>ส่วน<input id="calc-denominator" type="number" inputmode="decimal" step="any" placeholder="2"></label><button type="button" data-calc-action="insertFraction">ใส่</button></div><div class="calculator-keys" aria-label="ปุ่มเครื่องคิดเลข"><button data-calc-action="clear">C</button><button data-calc-value="(">(</button><button data-calc-value=")">)</button><button data-calc-action="back" aria-label="ลบตัวก่อนหน้า">⌫</button><button data-calc-value="7">7</button><button data-calc-value="8">8</button><button data-calc-value="9">9</button><button class="calc-op" data-calc-value="÷">÷</button><button data-calc-value="4">4</button><button data-calc-value="5">5</button><button data-calc-value="6">6</button><button class="calc-op" data-calc-value="×">×</button><button data-calc-value="1">1</button><button data-calc-value="2">2</button><button data-calc-value="3">3</button><button class="calc-op" data-calc-value="−">−</button><button data-calc-value="0">0</button><button data-calc-value=".">.</button><button class="calc-op" data-calc-value="^" aria-label="ยกกำลัง">xʸ</button><button class="calc-op" data-calc-value="+">+</button><button class="calc-fraction-key" data-calc-action="fraction" aria-label="ใส่เศษส่วน">a⁄b</button><button class="calc-equals" data-calc-action="equals">=</button></div></section>`}
let calculatorReady=false;
function initCalculator(){
 if(calculatorReady||typeof document==='undefined'||!document.body||typeof document.body.insertAdjacentHTML!=='function')return;
 document.body.insertAdjacentHTML('beforeend',calculatorMarkup());calculatorReady=true;
 const panel=document.querySelector('#calculator-panel'),input=document.querySelector('#calc-expression'),answer=document.querySelector('#calc-answer'),fraction=document.querySelector('#calc-fraction');
 function resetAnswer(){answer.innerHTML='<span>ผลลัพธ์จะแสดงที่นี่</span>';answer.classList.remove('error')}
 function insert(value){const start=input.selectionStart??input.value.length,end=input.selectionEnd??input.value.length;input.value=input.value.slice(0,start)+value+input.value.slice(end);input.focus({preventScroll:true});input.setSelectionRange(start+value.length,start+value.length);resetAnswer()}
 function solve(){try{const result=calculateExpression(input.value),frac=calcFractionText(result.r);answer.classList.remove('error');answer.innerHTML=`<strong>= ${calcFormat(result.value)}</strong>${frac?`<small>เศษส่วน = ${frac}</small>`:''}`}catch(err){answer.classList.add('error');answer.textContent=err.message||'ตรวจสอบนิพจน์'} }
 panel.addEventListener('click',event=>{
  const el=event.target.closest('[data-calc-action],[data-calc-value]');if(!el)return;
  if(el.dataset.calcValue!==undefined){insert(el.dataset.calcValue);return}
  switch(el.dataset.calcAction){
   case 'close':closeCalculator();break;
   case 'clear':input.value='';fraction.hidden=true;resetAnswer();input.focus({preventScroll:true});break;
   case 'back':{const start=input.selectionStart??input.value.length,end=input.selectionEnd??input.value.length;if(start!==end){input.value=input.value.slice(0,start)+input.value.slice(end);input.setSelectionRange(start,start)}else if(start>0){input.value=input.value.slice(0,start-1)+input.value.slice(start);input.setSelectionRange(start-1,start-1)}input.focus({preventScroll:true});resetAnswer();break}
   case 'equals':solve();break;
   case 'fraction':fraction.hidden=!fraction.hidden;if(!fraction.hidden)document.querySelector('#calc-numerator').focus({preventScroll:true});break;
   case 'insertFraction':{let n=document.querySelector('#calc-numerator').value.trim(),d=document.querySelector('#calc-denominator').value.trim();if(n===''||d===''){answer.classList.add('error');answer.textContent='กรอกทั้งเศษและส่วน';return}if(Number(d)===0){answer.classList.add('error');answer.textContent='ส่วนของเศษส่วนต้องไม่เป็นศูนย์';return}let pos=input.selectionStart??input.value.length,prefix=input.value.slice(0,pos);let mul=/[\d)]\s*$/.test(prefix)?'×':'';insert(`${mul}(${n}÷${d})`);fraction.hidden=true;document.querySelector('#calc-numerator').value='';document.querySelector('#calc-denominator').value='';break}
  }
 });
 input.addEventListener('input',resetAnswer);input.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();solve()}else if(ev.key==='Escape'){ev.preventDefault();closeCalculator()}});
}
function toggleCalculator(){initCalculator();const panel=document.querySelector('#calculator-panel');if(!panel)return;panel.hidden=!panel.hidden;for(const b of document.querySelectorAll('[data-action="toggleCalc"]'))b.setAttribute('aria-expanded',String(!panel.hidden));if(!panel.hidden)document.querySelector('#calc-expression')?.focus({preventScroll:true})}
function closeCalculator(){const panel=document.querySelector('#calculator-panel');if(panel)panel.hidden=true;for(const b of document.querySelectorAll('[data-action="toggleCalc"]'))b.setAttribute('aria-expanded','false')}
initCalculator();
</script>
<script>// A simple per-question scratch sheet. Strokes are stored locally in IndexedDB.
const PAD_TOOLS={black:{label:'ปากกาสีดำ',color:'#1f2937',width:2.5},blue:{label:'ปากกาสีน้ำเงิน',color:'#1d4ed8',width:2.5},red:{label:'ปากกาสีแดง',color:'#d33636',width:2.5},eraser:{label:'ยางลบ',color:'#000000',width:24}};
const padSheets=new Map();
let padDBPromise=null, padCleanup=null, padStorageWarned=false;
function padDatabase(){
 if(padDBPromise)return padDBPromise;
 padDBPromise=new Promise(resolve=>{
  if(typeof indexedDB==='undefined'){resolve(null);return}
  let req;try{req=indexedDB.open('econprep-scratch-v1',1)}catch{resolve(null);return}
  req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('sheets'))req.result.createObjectStore('sheets')};
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>resolve(null);req.onblocked=()=>resolve(null);
 });
 return padDBPromise;
}
function padRead(key){return padDatabase().then(db=>new Promise(resolve=>{if(!db){resolve([]);return}try{const req=db.transaction('sheets','readonly').objectStore('sheets').get(key);req.onsuccess=()=>resolve(Array.isArray(req.result)?req.result:[]);req.onerror=()=>resolve([])}catch{resolve([])}}))}
function getPadSheet(key){
 if(padSheets.has(key))return padSheets.get(key);
 const sheet={key,strokes:[],loaded:false,chain:Promise.resolve()};padSheets.set(key,sheet);
 sheet.ready=padRead(key).then(strokes=>{sheet.strokes=strokes;sheet.loaded=true;return sheet}).catch(()=>{sheet.loaded=true;return sheet});
 return sheet;
}
function savePadSheet(sheet){
 const snapshot=sheet.strokes.map(s=>({tool:s.tool,points:s.points.map(p=>[p[0],p[1]])}));
 sheet.chain=sheet.chain.catch(()=>{}).then(()=>padDatabase()).then(db=>new Promise(resolve=>{
  if(!db){if(!padStorageWarned){padStorageWarned=true;toast('กระดาษทดบันทึกไม่ได้ แต่ยังใช้ได้ชั่วคราวในหน้านี้')}resolve();return}
  try{const tx=db.transaction('sheets','readwrite');tx.objectStore('sheets').put(snapshot,sheet.key);tx.oncomplete=()=>resolve();tx.onerror=tx.onabort=()=>{if(!padStorageWarned){padStorageWarned=true;toast('บันทึกกระดาษทดไม่สำเร็จ รอยเขียนยังอยู่ในหน้านี้')}resolve()}}catch{if(!padStorageWarned){padStorageWarned=true;toast('บันทึกกระดาษทดไม่สำเร็จ รอยเขียนยังอยู่ในหน้านี้')}resolve()}
 }));
}
function scratchMarkup(){
 const selected=PAD_TOOLS[state.paperTool]?state.paperTool:'black';const calculatorOpen=!!document.querySelector('#calculator-panel:not([hidden])');

function mountScratch(key){
 teardownScratch();
 const layout=document.querySelector('.scratch-layout'),canvas=document.querySelector('#scratch-canvas'),splitter=document.querySelector('#pad-splitter'),loading=document.querySelector('#pad-loading');
 if(!layout||!canvas||!splitter)return;
 const ctx=canvas.getContext('2d');if(!ctx){if(loading)loading.textContent='เบราว์เซอร์นี้ไม่รองรับการเขียน';return}
 const sheet=getPadSheet(key),paper=canvas.parentElement;
 let active=true,stroke=null,pointer=null,dragPointer=null,raf=0,dpr=1,lastW=0,lastH=0,currentSplit=0.53;
 const toolNow=()=>PAD_TOOLS[state.paperTool]?state.paperTool:'black';
 function setCanvasSize(){
  if(!active)return;const rect=canvas.getBoundingClientRect();if(!rect.width||!rect.height)return;
  const scale=Math.min(window.devicePixelRatio||1,2.5),w=Math.max(1,Math.round(rect.width*scale)),h=Math.max(1,Math.round(rect.height*scale));
  if(w===lastW&&h===lastH&&scale===dpr)return;
  lastW=w;lastH=h;dpr=scale;canvas.width=w;canvas.height=h;ctx.setTransform(dpr,0,0,dpr,0,0);redraw();
 }
 function paint(stroke,from,to){
  const tool=PAD_TOOLS[stroke.tool]||PAD_TOOLS.black;ctx.save();ctx.globalCompositeOperation=stroke.tool==='eraser'?'destination-out':'source-over';ctx.strokeStyle=tool.color;ctx.fillStyle=tool.color;ctx.lineWidth=tool.width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  if(to){ctx.moveTo(from[0],from[1]);ctx.lineTo(to[0],to[1]);ctx.stroke()}else{ctx.arc(from[0],from[1],tool.width/2,0,Math.PI*2);ctx.fill()}ctx.restore();
 }
 function redraw(){
  if(!active)return;ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);
  for(const line of sheet.strokes){if(!Array.isArray(line.points)||!line.points.length)continue;if(line.points.length===1)paint(line,line.points[0]);else for(let i=1;i<line.points.length;i++)paint(line,line.points[i-1],line.points[i])}
 }
 function scheduleResize(){if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{raf=0;setCanvasSize()})}
 const observer=typeof ResizeObserver==='function'?new ResizeObserver(scheduleResize):null;if(observer)observer.observe(paper);else window.addEventListener('resize',scheduleResize);
 function point(ev){const r=canvas.getBoundingClientRect();return [Math.round((ev.clientX-r.left)*10)/10,Math.round((ev.clientY-r.top)*10)/10]}
 function down(ev){
  if(!sheet.loaded||pointer!==null||(ev.pointerType==='mouse'&&ev.button!==0))return;ev.preventDefault();pointer=ev.pointerId;try{canvas.setPointerCapture(pointer)}catch{}

 }
 function move(ev){
  if(pointer!==ev.pointerId||!stroke)return;ev.preventDefault();const events=typeof ev.getCoalescedEvents==='function'?ev.getCoalescedEvents():[];const samples=events.length?events:[ev];
  for(const sample of samples){const next=point(sample),prev=stroke.points[stroke.points.length-1];if(Math.hypot(next[0]-prev[0],next[1]-prev[1])<0.8)continue;stroke.points.push(next);paint(stroke,prev,next)}
 }
 function finish(ev){if(pointer!==ev.pointerId||!stroke)return;ev.preventDefault();pointer=null;stroke=null;savePadSheet(sheet)}
 canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);canvas.addEventListener('lostpointercapture',finish);
 const buttons=[...layout.querySelectorAll('[data-pad-tool]')];
 function selectTool(ev){const button=ev.currentTarget,tool=button.dataset.padTool;if(!PAD_TOOLS[tool])return;state.paperTool=tool;save();for(const b of buttons){let on=b.dataset.padTool===tool;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))}canvas.classList.toggle('erasing',tool==='eraser')}
 for(const b of buttons)b.addEventListener('click',selectTool);
 canvas.classList.toggle('erasing',toolNow()==='eraser');
 function splitBounds(){const width=layout.getBoundingClientRect().width,divider=splitter.getBoundingClientRect().width;const minLeft=Math.min(300,Math.max(105,width*0.25)),minRight=Math.min(265,Math.max(105,width*0.25));return {width,min:minLeft/width,max:(width-divider-minRight)/width}}
 function applySplit(value,persist=false){const b=splitBounds();if(!b.width)return;const ratio=Math.max(b.min,Math.min(b.max,value));currentSplit=ratio;layout.style.setProperty('--paper-split',`${ratio*100}%`);splitter.setAttribute('aria-valuemin',String(Math.round(b.min*100)));splitter.setAttribute('aria-valuemax',String(Math.round(b.max*100)));splitter.setAttribute('aria-valuenow',String(Math.round(ratio*100)));if(persist){state.paperSplit=ratio;save()}}

function migrateScope(){
 const valid=new Set(QUESTIONS.map(q=>q.id)),validLessons=new Set(LESSONS.map(l=>l.id)),oldStats=state.stats;
 state.bookmarks=state.bookmarks.filter(id=>valid.has(id));state.learned=state.learned.filter(id=>validLessons.has(id));

  const oldIds=p.ids.slice(),index=Math.max(0,Math.min(p.index,oldIds.length-1)),current=oldIds[index];

 }

function practiceStart(){const s=summary(),p=state.practice;main.innerHTML=head('PRACTICE / LEARN BY DOING','ฝึกทีละข้อ','ตอบแล้วดูเฉลยละเอียดทันที แต่ละข้อปรากฏครั้งเดียวภายในชุด')+`<section class="source-card"><h2>เลือกชุดฝึก</h2><div class="setup"><label>บทที่ต้องการ<select id="practice-chapter"><option value="all">ทั้ง 9.1, 9.2 และ 9.3</option><option value="9.1">เฉพาะ 9.1</option><option value="9.2">เฉพาะ 9.2</option><option value="9.3">เฉพาะ 9.3</option></select></label></div><div class="actions"><button class="primary" data-action="beginPractice" data-mode="all">${p&&!p.finished?'เริ่มชุดฝึกใหม่':'ฝึกให้ครบทุกข้อ'} →</button><button class="secondary" data-action="beginPractice" data-mode="weak">ข้อที่ยังผิด · ${s.weak}</button><button class="secondary" data-action="beginPractice" data-mode="saved">ข้อที่บันทึก · ${state.bookmarks.length}</button></div>${p&&!p.finished?`<div class="notice">มีชุดที่ทำค้างไว้ · อยู่ข้อ ${p.index+1}/${p.ids.length}<br><button class="text-link" data-action="resumePractice">กลับไปทำต่อ</button>${confirmPracticeReset?'<p>เริ่มชุดใหม่จะเขียนทับชุดฝึกเดิม แต่สถิติและข้อที่บันทึกยังอยู่</p><button class="primary btn-sm" data-action="confirmPracticeReset">ยืนยันเริ่มชุดใหม่</button> <button class="secondary btn-sm" data-action="cancelPracticeReset">ยกเลิก</button>':''}</div>`:''}<p class="micro">ผลการทำบันทึกในอุปกรณ์นี้ · ตอบผิดก็ไปข้อต่อไป ไม่แทรกข้อเดิมในชุด</p></section>${sourceNote()}`}
let pendingPractice=null;
function startPractice(mode='all',chapter='all',topic='',force=false,singleId=''){
 if(state.practice&&!state.practice.finished&&!force){pendingPractice={mode,chapter,topic,singleId};confirmPracticeReset=true;setView('practiceStart');return}
 let pool=QUESTIONS.filter(q=>(chapter==='all'||q.chapter===chapter)&&(!topic||q.topic===topic));
 if(mode==='weak')pool=pool.filter(q=>stat(q.id).lastCorrect===false);if(mode==='saved')pool=pool.filter(q=>state.bookmarks.includes(q.id));if(mode==='single')pool=pool.filter(q=>q.id===singleId);
 if(!pool.length){toast(mode==='weak'?'ยังไม่มีข้อที่ตอบผิดในบทที่เลือก':mode==='saved'?'ยังไม่มีข้อที่บันทึกไว้ในบทที่เลือก':'ไม่มีโจทย์ในชุดนี้');return}
 const ids=shuf(pool.map(q=>q.id)),orders=Object.fromEntries(ids.map(id=>[id,shuf([0,1,2,3])]));
 state.practice={mode,chapter,topic,ids,orders,index:0,selected:null,revealed:false,finished:false,correct:0,answered:0,started:Date.now()};state.round++;confirmPracticeReset=false;pendingPractice=null;save();setView('practice');
}
function practice(){
 teardownScratch();let p=state.practice;if(!p||p.finished){setView('practiceStart');return}let q=find(p.ids[p.index]);if(!q){state.practice=null;save();setView('practiceStart');return}
 if(!p.started){p.started=Date.now();save()}
 const remaining=p.ids.length-p.index-(p.revealed?1:0);
 main.innerHTML=`<div class="page-head flex-between work-head"><div><div class="eyebrow">PRACTICE / ${esc(p.topic || (p.chapter==='all'?'ALL TOPICS':p.chapter))}</div><h1>ฝึกทีละข้อ</h1></div><button class="secondary btn-sm" data-view="home">พักก่อน</button></div>
 <div class="work-summary"><div class="work-stats"><span>ข้อ <strong>${p.index+1} / ${p.ids.length}</strong></span><span>ตอบแล้ว <strong>${p.answered}</strong></span><span>ถูก <strong>${p.correct}</strong></span><span>เหลือ <strong>${remaining}</strong></span></div></div>
 <div class="scratch-layout"><section class="question-card">${questionUI(q,p.orders[q.id],p.selected,p.revealed)}<div class="question-bottom"><button class="bookmark ${state.bookmarks.includes(q.id)?'on':''}" data-action="bookmark" data-id="${q.id}">${state.bookmarks.includes(q.id)?'★ บันทึกไว้แล้ว':'☆ บันทึกข้อนี้'}</button>${p.revealed?`<button class="primary" data-action="practiceNext">${p.index===p.ids.length-1?'สรุปชุดนี้':'ข้อต่อไป'} →</button>`:`<button class="primary" data-action="practiceCheck" ${p.selected===null?'disabled':''}>ตรวจคำตอบ →</button>`}</div><p class="kbd">เลือกคำตอบ 1–4 · Enter เพื่อตรวจหรือไปข้อต่อไป</p></section>${scratchMarkup()}</div>`;
 mountScratch(`practice:${p.started}:${q.id}`);
}
function practiceDone(){const p=state.practice;main.innerHTML=`<section class="result-hero"><div class="eyebrow">PRACTICE COMPLETE</div><h1>ฝึกครบชุดแล้ว</h1><div class="score">${p.correct}<small> / ${p.ids.length}</small></div><p>ทำครบ ${p.answered} ข้อ และไม่แทรกข้อซ้ำในชุดนี้</p><div class="actions"><button class="primary" data-action="beginPractice" data-mode="weak">ทบทวนข้อที่ยังผิด</button><button class="secondary" data-view="bank">เปิดคลังข้อสอบ</button><button class="text-link" data-view="home">กลับภาพรวม</button></div></section>`}
function checkPractice(){let p=state.practice;if(!p||p.revealed||p.selected===null)return;const q=find(p.ids[p.index]);let ok=p.selected===q.correct;p.revealed=true;p.answered++;if(ok)p.correct++;record(q.id,ok);save();practice()}
function nextPractice(){const p=state.practice;if(!p||!p.revealed)return;if(p.index===p.ids.length-1){p.finished=true;save();setView('practiceDone');return}p.index++;p.selected=null;p.revealed=false;save();practice();goTop()}
function topicSelection(pool,count){let groups={};for(const q of pool)(groups[q.topic]??=[]).push(q);let ids=[],topicOrder=shuf(Object.keys(groups));for(let topic of topicOrder){if(ids.length>=count)break;ids.push(shuf(groups[topic])[0].id)}if(ids.length<count){let rest=shuf(pool.filter(q=>!ids.includes(q.id)).map(q=>q.id));ids.push(...rest.slice(0,count-ids.length))}return ids}
function examSetup(){const e=state.exam,resume=e&&!e.finished;main.innerHTML=head('EXAM ROOM / 10 QUESTIONS','จำลองควิซ 10 ข้อ','โจทย์ 4 ตัวเลือก ไม่มีข้อซ้ำในชุด และแสดงเฉลยหลังส่งคำตอบ')+`<section class="source-card"><h2>ตั้งค่าชุดสอบ</h2><div class="setup"><label>เนื้อหาที่ออก<select id="exam-chapter"><option value="all">ผสม 9.1 + 9.2 + 9.3 (บทละ 3–4 ข้อ)</option><option value="9.1">เฉพาะ 9.1</option><option value="9.2">เฉพาะ 9.2</option><option value="9.3">เฉพาะ 9.3</option></select></label><label>เวลาฝึก<select id="exam-minutes"><option value="0">ไม่จับเวลา</option><option value="15">15 นาที</option><option value="20">20 นาที</option><option value="30">30 นาที</option></select></label></div><div class="notice">ชุดผสมสุ่มให้แต่ละบทมี 3–4 ข้อ และเลือกหัวข้อให้หลากหลาย · สัดส่วนและเวลาใช้เพื่อฝึก ไม่ใช่รายละเอียดสอบจริงที่ยืนยันแล้ว</div>${resume?`<p>มีชุดสอบที่ยังทำไม่เสร็จ (${Object.keys(e.answers).length}/10 ข้อ)${e.deadline?' · เวลายังคงเดินขณะพัก':''}</p><div class="actions"><button class="primary" data-action="resumeExam">ทำชุดเดิมต่อ →</button><button class="secondary" data-action="restartExam">เริ่มชุดใหม่</button></div>${confirmRestart?'<div class="warning">เริ่มชุดใหม่จะเขียนทับชุดสอบที่ยังไม่ส่ง <div class="actions"><button class="primary btn-sm" data-action="confirmRestartExam">ยืนยันเริ่มชุดใหม่</button><button class="secondary btn-sm" data-action="cancelRestart">ยกเลิก</button></div></div>':''}`:'<button class="primary" data-action="beginExam">เริ่มจำลองสอบ →</button>'}</section>${sourceNote()}`}
function examSelection(ch){
 if(ch==='all'){const chapters=['9.1','9.2','9.3'],extra=shuf(chapters)[0];return shuf(chapters.flatMap(c=>topicSelection(QUESTIONS.filter(q=>q.chapter===c),c===extra?4:3)))}
 return shuf(topicSelection(QUESTIONS.filter(q=>q.chapter===ch),10));

 state.exam={ids,orders:Object.fromEntries(ids.map(id=>[id,shuf([0,1,2,3])])),answers:{},index:0,chapter:ch,started:Date.now(),deadline:minutes?Date.now()+minutes*60000:null,finished:false};confirmRestart=false;confirmExamSubmit=false;save();setView('exam');}

 main.innerHTML=`<div class="page-head flex-between work-head"><div><div class="eyebrow">EXAM ROOM / QUESTION ${e.index+1} OF 10</div><h1>จำลองควิซ</h1></div><button class="secondary btn-sm" data-view="home">พักก่อน</button></div>

 <div class="scratch-layout"><section class="question-card">${questionUI(q,e.orders[q.id],selected,false,{exam:true})}<div class="exam-actions"><button class="secondary" data-action="examPrev" ${e.index===0?'disabled':''}>← ก่อนหน้า</button>${e.index<e.ids.length-1?'<button class="primary" data-action="examNext">ข้อถัดไป →</button>':'<button class="primary" data-action="askSubmit">ตรวจและส่งชุด →</button>'}</div>${confirmExamSubmit?`<div class="warning exam-warning">${answered<10?`ยังไม่ได้ตอบ ${10-answered} ข้อ ข้อที่ข้ามจะนับเป็น 0 คะแนน`: 'ตอบครบแล้ว พร้อมส่งคำตอบ'}<div class="actions"><button class="primary btn-sm" data-action="confirmSubmit">ยืนยันส่งคำตอบ</button><button class="secondary btn-sm" data-action="cancelSubmit">กลับไปตรวจ</button></div></div>`:''}</section>${scratchMarkup()}</div>`;

function tick(){const e=state.exam;if(!e||e.finished)return;const left=Math.max(0,Math.ceil((e.deadline-Date.now())/1000)), el=$('#timer');if(el)el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(!left){clearInterval(timer);finishExam()}}
function finishExam(){const e=state.exam;if(!e||e.finished)return;e.finished=true;e.score=0;for(const id of e.ids){const answer=e.answers[id];if(answer!==undefined){const ok=answer===find(id).correct;record(id,ok);if(ok)e.score++}}save();confirmExamSubmit=false;reviewFilter='all';setView('result')}
function result(){const e=state.exam;if(!e||!e.finished){setView('examSetup');return}let answered=Object.keys(e.answers).length;let qs=e.ids.map((id,i)=>({q:find(id),n:i+1,ans:e.answers[id]??null}));if(reviewFilter==='wrong')qs=qs.filter(x=>x.ans!==x.q.correct);main.innerHTML=`<section class="result-hero"><div class="eyebrow">QUIZ COMPLETE / REVIEW YOUR REASONING</div><h1>จบชุดจำลองสอบแล้ว</h1><div class="score">${e.score}<small> / ${e.ids.length}</small></div><p>ตอบแล้ว ${answered}/${e.ids.length} ข้อ · คำตอบที่ข้ามนับ 0 คะแนน</p><div class="actions"><button class="primary" data-view="examSetup">ทำชุดใหม่ →</button><button class="secondary" data-view="home">กลับภาพรวม</button></div></section><div class="section-title"><h2>ทบทวนเฉลยทุกข้อ</h2><div class="actions"><button class="${reviewFilter==='all'?'primary':'secondary'} btn-sm" data-action="reviewFilter" data-filter="all">ทุกข้อ</button><button class="${reviewFilter==='wrong'?'primary':'secondary'} btn-sm" data-action="reviewFilter" data-filter="wrong">ผิด / ข้าม</button></div></div>${qs.length?qs.map(({q,n,ans})=>`<article class="review-item"><div class="question-meta"><span class="tag">ข้อ ${n} · ${esc(q.topic)}</span><span class="micro">${esc(q.id)} · ${esc(q.origin)}</span></div><h3 class="result-question">${esc(q.question)}</h3><p class="review-choice">คำตอบของคุณ: <b>${ans===null?'ยังไม่ได้ตอบ':esc(q.options[ans])}</b></p>${feedback(q,ans)}</article>`).join(''):'<div class="empty">ไม่มีข้อผิดหรือข้ามในชุดนี้</div>'}`}
function bank(){main.innerHTML=head('QUESTION BANK / QUICK REVIEW','คลังข้อสอบ','ค้นหาโจทย์ด้วยคีย์เวิร์ด กรองตามบทหรือหัวข้อ แล้วเปิดดูเฉลยได้ทันที')+`<div class="filters"><input id="bank-query" type="search" placeholder="ค้นหาโจทย์ เช่น เงินเฟ้อ, gradient, ค่าเสื่อม" value="${esc(bankFilter.query)}" aria-label="ค้นหาโจทย์"><select id="bank-chapter" aria-label="กรองตามบท"><option value="all">ทุกบท</option><option value="9.1" ${bankFilter.chapter==='9.1'?'selected':''}>9.1</option><option value="9.2" ${bankFilter.chapter==='9.2'?'selected':''}>9.2</option><option value="9.3" ${bankFilter.chapter==='9.3'?'selected':''}>9.3</option></select><select id="bank-topic" aria-label="กรองตามหัวข้อ"><option value="all">ทุกหัวข้อ</option>${topics().map(t=>`<option value="${esc(t)}" ${bankFilter.topic===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="actions" style="margin-bottom:10px"><button class="secondary btn-sm" data-action="bankWeak">เฉพาะข้อที่ยังผิด</button><button class="secondary btn-sm" data-action="bankSaved">เฉพาะข้อที่บันทึก</button><button class="text-link" data-action="bankReset">ล้างตัวกรอง</button></div><div id="bank-results"></div>`;fillBank()}
let bankSpecial='all';
function fillBank(){const target=$('#bank-results');if(!target)return;const text=bankFilter.query.trim().toLowerCase();let pool=QUESTIONS.filter(q=>(bankFilter.chapter==='all'||q.chapter===bankFilter.chapter)&&(bankFilter.topic==='all'||q.topic===bankFilter.topic)&&(!text||[q.question,q.topic,q.ref,q.options.join(' '),q.why].join(' ').toLowerCase().includes(text))&&(bankSpecial==='all'||(bankSpecial==='weak'&&stat(q.id).lastCorrect===false)||(bankSpecial==='saved'&&state.bookmarks.includes(q.id))));target.innerHTML=`<p class="bank-count">พบ ${pool.length} จาก ${QUESTIONS.length} ข้อ${bankSpecial==='weak'?' · เฉพาะข้อที่ตอบผิดล่าสุด':bankSpecial==='saved'?' · เฉพาะข้อที่บันทึก':''}</p>${pool.length?pool.map(q=>`<article class="bank-row"><div class="question-meta"><span class="tag">${esc(q.chapter)} · ${esc(q.topic)}</span><span class="micro">${q.id} · ${esc(q.origin)}</span></div><h3>${esc(q.question)}</h3><details><summary>ดูเฉลยและวิธีคิด</summary>${feedback(q,null,true)}</details><button class="bookmark ${state.bookmarks.includes(q.id)?'on':''}" data-action="bookmarkBank" data-id="${q.id}">${state.bookmarks.includes(q.id)?'★ บันทึกแล้ว':'☆ บันทึก'}</button><button class="text-link" data-action="singlePractice" data-id="${q.id}">ฝึกข้อนี้ →</button></article>`).join(''):'<div class="empty">ไม่พบข้อที่ตรงกับตัวกรอง ลองคำค้นอื่น</div>'}`}
function render(){switch(view){case 'home':return home();case 'learn':return learn();case 'lesson':return lesson();case 'practiceStart':return practiceStart();case 'practice':return practice();case 'practiceDone':return practiceDone();case 'examSetup':return examSetup();case 'exam':return exam();case 'result':return result();case 'bank':return bank();default:view='home';return home()}}
document.addEventListener('click',e=>{
 const viewEl=e.target.closest('[data-view]');if(viewEl){e.preventDefault();setView(viewEl.dataset.view);return}
 const choice=e.target.closest('[data-choice]');if(choice){const value=Number(choice.dataset.choice);if(view==='practice'){const p=state.practice;if(!p.revealed){p.selected=value;save();practice()}}else if(view==='exam'){const ex=state.exam;if(ex&&!ex.finished){ex.answers[ex.ids[ex.index]]=value;save();exam()}}return}
 const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id;
 switch(action){
 case 'toggleCalc':toggleCalculator();break;
 case 'openLesson': if(LESSONS.some(l=>l.id===id)){lessonId=id;setView('lesson')}break;
 case 'markLesson':if(state.learned.includes(id))state.learned=state.learned.filter(x=>x!==id);else state.learned.push(id);save();lesson();toast(state.learned.includes(id)?'บันทึกว่าอ่านจบแล้ว':'ยกเลิกเครื่องหมายอ่านจบ');break;
 case 'lessonPractice':startPractice('topic','all',el.dataset.topic);break;
 case 'beginPractice':startPractice(el.dataset.mode,$('#practice-chapter')?.value||'all');break;
 case 'confirmPracticeReset':if(pendingPractice){const p=pendingPractice;startPractice(p.mode,p.chapter,p.topic,true,p.singleId||'')}break;
 case 'cancelPracticeReset':confirmPracticeReset=false;pendingPractice=null;practiceStart();break;
 case 'resumePractice':confirmPracticeReset=false;setView('practice');break;
 case 'practiceCheck':checkPractice();break;
 case 'practiceNext':nextPractice();break;
 case 'bookmark':case 'bookmarkBank':if(state.bookmarks.includes(id))state.bookmarks=state.bookmarks.filter(x=>x!==id);else state.bookmarks.push(id);save();if(action==='bookmark'&&view==='practice')practice();else if(view==='bank')fillBank();toast(state.bookmarks.includes(id)?'บันทึกข้อนี้แล้ว':'นำออกจากรายการบันทึก');break;
 case 'beginExam':beginExam();break;
 case 'resumeExam':confirmRestart=false;setView('exam');break;
 case 'restartExam':confirmRestart=true;examSetup();break;
 case 'confirmRestartExam':beginExam();break;
 case 'cancelRestart':confirmRestart=false;examSetup();break;
 case 'examPrev':if(state.exam.index>0)state.exam.index--;confirmExamSubmit=false;save();exam();goTop();break;
 case 'examNext':if(state.exam.index<state.exam.ids.length-1)state.exam.index++;confirmExamSubmit=false;save();exam();goTop();break;
 case 'jumpExam':state.exam.index=Number(el.dataset.index);confirmExamSubmit=false;save();exam();goTop();break;
 case 'askSubmit':confirmExamSubmit=true;exam();document.querySelector('.exam-warning')?.scrollIntoView({behavior:'smooth',block:'nearest'});break;
 case 'cancelSubmit':confirmExamSubmit=false;exam();break;
 case 'confirmSubmit':finishExam();break;
 case 'reviewFilter':reviewFilter=el.dataset.filter;result();break;
 case 'bankWeak':bankSpecial=bankSpecial==='weak'?'all':'weak';fillBank();break;
 case 'bankSaved':bankSpecial=bankSpecial==='saved'?'all':'saved';fillBank();break;
 case 'bankReset':bankFilter={query:'',chapter:'all',topic:'all'};bankSpecial='all';bank();break;
 case 'singlePractice':startPractice('single','all','',false,id);break;
 }
});
document.addEventListener('change',e=>{if(e.target.id==='lesson-select'){lessonId=e.target.value;setView('lesson')}else if(e.target.id==='bank-chapter'){bankFilter.chapter=e.target.value;fillBank()}else if(e.target.id==='bank-topic'){bankFilter.topic=e.target.value;fillBank()}});
document.addEventListener('input',e=>{if(e.target.id==='bank-query'){bankFilter.query=e.target.value;fillBank()}});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(view==='practice'&&!e.altKey&&!e.ctrlKey&&!e.metaKey){const p=state.practice;if(!p)return;if(!p.revealed&&/^[1-4]$/.test(e.key)){p.selected=p.orders[p.ids[p.index]][Number(e.key)-1];save();practice()}else if(e.key==='Enter'&&(document.activeElement===main||document.activeElement===document.body)){e.preventDefault();p.revealed?nextPractice():checkPractice()}}});
$('#update').addEventListener('click',()=>{const url=new URL(location.href);url.searchParams.set('refresh',String(Date.now()));location.replace(url.toString())});
setView('home',{focus:false});
</script>
</body></html>
