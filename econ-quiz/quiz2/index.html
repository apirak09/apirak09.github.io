<p>เริ่มจากวาดเส้นเวลาและระบุเงินที่เข้า–ออกก่อนเลือกสูตร มองจากฝั่งผู้ลงทุน: เงินลงทุนและค่าใช้จ่ายเป็นลบ เงินรับเป็นบวก</p><div class="formula">เงินลงทุนเริ่มต้นอาจประกอบด้วย ที่ดิน + FCI<sub>L</sub> + Working Capital<br>เมื่อปิดโครงการ อาจได้ราคาที่ดิน + WC + มูลค่าซากคืน ตามโจทย์</div>

<p>หาก COMd ที่โจทย์ให้ <b>ไม่รวมค่าเสื่อม</b> และกำไรเสียภาษีเป็นบวก ให้หาภาษีจากรายรับลบต้นทุนลบค่าเสื่อม แล้วบวกค่าเสื่อมกลับเพื่อหากระแสเงินสด</p><div class="formula">กำไรก่อนภาษี = R − COMd − d<sub>k</sub><br>กำไรหลังภาษี = (R − COMd − d<sub>k</sub>)(1−t)<br>Operating CF = (R − COMd − d<sub>k</sub>)(1−t)+d<sub>k</sub></div>
<h3>ตัวอย่างโรงงานในสไลด์ หน่วยล้านดอลลาร์</h3><ol><li>รายรับ 75, COMd 30, ค่าเสื่อมปีแรก 30 และภาษี 45%</li><li>กำไรก่อนภาษี = 75−30−30 = 15; ภาษี = 15(0.45)=6.75</li><li>กำไรหลังภาษี = 8.25; บวกค่าเสื่อมกลับ 30 → <b>CF = 38.25 ล้าน</b></li></ol><p>ค่าเสื่อมไม่ใช่เงินสดที่จ่ายซ้ำปีนั้น แต่มีผลลดฐานภาษี ตรวจด้วยว่า COMd รวมค่าเสื่อมแล้วหรือยัง เพื่อไม่หักซ้ำ</p><div class="warning">เงินขายซากอาจมีภาษีจากกำไร/ขาดทุนเมื่อขายเทียบกับ book value ตามเงื่อนไขโจทย์ อย่าสมมติทุกข้อเหมือนกัน</div>`},
{id:'undiscounted-metrics',chapter:'10.1',title:'CCP, CCR และ ROROI',topic:'CCP CCR และ ROROI',pages:'10.1 หน้า 5–12',read:'9 นาที',html:`
<p>ตัวชี้วัดแบบ <b>ไม่คิดลด</b> รวมเงินต่างเวลาเป็นตัวเลขตามจำนวนเงิน จึงคำนวณง่ายแต่ไม่สะท้อน time value of money</p><div class="formula">CCP = ผลรวม CF ทั้งโครงการ ณ สิ้นอายุ (ยังไม่ discount)<br>CCR = ผลรวมเงินเข้า / ขนาดผลรวมเงินออก<br>ROROI = กำไรสุทธิเฉลี่ยต่อปี / FCI<sub>L</sub></div>
<p>ถ้าเงินออกเริ่มต้น 100 และเงินเข้ารวม 140: CCP=40 และ CCR=140/100=1.40 ภายใต้กรณีเงินออกมีเพียง 100 ค่า CCR=1+CCP/100</p><p>ถ้า FCI<sub>L</sub>=200 ล้าน และกำไรสุทธิหลังภาษีเฉลี่ยปีละ 20 ล้าน → ROROI=20/200=10% ต่อปี เป็น accounting return โดยโจทย์ต้องบอกนิยามกำไรและฐานให้ชัด</p><div class="tip">อย่าสับสน <b>กำไรสุทธิ</b> กับ <b>cash flow</b>: cash flow บวกค่าเสื่อมกลับแล้ว ในขณะที่กำไรสุทธิยังหักค่าเสื่อมอยู่</div>`},
{id:'payback-conventions',chapter:'10.1',title:'PBP: ระยะคืนทุนและนิยามฐาน',topic:'ระยะคืนทุน PBP',pages:'10.1 หน้า 6, 12, 34–45; ข้อสอบ 2025',read:'10 นาที',html:`
<p><b>PBP</b> คือเวลาจนเงินรับสะสมชดเชยฐานลงทุนที่กำหนด โดยยังไม่คิดลด แต่คำว่า “คืนทุน” ต้องดูว่าโจทย์ให้นับฐานใดและเริ่มนับเมื่อไร</p><div class="formula">PBP เมื่อเงินรับเท่ากันทุกปี = ฐานลงทุน / CF ต่อปี<br>ถ้า CF ไม่เท่ากัน: ปีเต็มก่อนถึงเป้า + ส่วนที่ยังขาด / CF ของปีถัดไป</div>
<h3>ตัวอย่าง</h3><p>ลงทุน 100, ได้ CF 30, 30, 50 สิ้นปี: สิ้นปี 2 รับสะสม 60 ยังขาด 40 → แบบประมาณเชิงเส้น PBP=2+40/50=<b>2.8 ปี</b> หากจ่ายเป็นก้อนสิ้นปีจริงและไม่สมมติไหลสม่ำเสมอ จะครบเมื่อสิ้นปี 3</p>
<p>ในสไลด์โรงงาน นิยาม PBP คือเวลาหลัง start-up เพื่อคืน <b>FCI<sub>L</sub></b> โดยไม่นับ WC และที่ดินที่ตั้งสมมติฐานว่ากู้คืนได้; บางโจทย์ใช้เงินลงทุนทั้งหมด ต้องดูคำจำกัดความก่อนเสมอ</p><div class="warning">PBP ไม่ดูเงินหลังคืนทุน และ PBP ปกติไม่คิดมูลค่าเงินตามเวลา จึงเหมาะเป็นตัวกรองร่วมกับ NPV ไม่ใช่ตัดสินเพียงตัวเดียว</div>`},
{id:'lecture-case-150',chapter:'10.1',title:'แกะตัวอย่างในสไลด์: โรงงาน 150 ล้าน',topic:'ตัวอย่างโรงงาน 150 ล้าน',pages:'10.1 หน้า 10–12, 17, 23–25',read:'11 นาที',html:`
<p>ตัวอย่าง 10.1 แยกเงินลงทุนที่ดิน 10 ล้านที่ปี 0, FCI<sub>L</sub> 90 ล้านที่ปี 1 และ 60 ล้านที่ปี 2, WC 30 ล้านที่ปี 2 โดย start-up เมื่อสิ้นปี 2 และดำเนินงาน 10 ปี รายรับ 75, COMd 30, ภาษี 45%, ใช้ MACRS 5 ปี</p>
<ol><li>ค่าเสื่อมปีดำเนินงานแรก = 150(20%)=30 ล้าน; CF หลังภาษี = (75−30−30)(1−0.45)+30=<b>38.25 ล้าน</b></li><li>ค่าเสื่อมปีถัดมา = 150(32%)=48 ล้าน; CF = (75−30−48)(0.55)+48=<b>46.35 ล้าน</b></li><li>สไลด์นับ PBP เพื่อคืน FCI<sub>L</sub> จึงหา cumulative CF เมื่อถึง −(ที่ดิน+WC)=−40 ล้าน: หลัง start-up 3 ปี cumulative≈−67.69 และ 4 ปี≈−35.16 → PBP≈<b>3.85 ปี</b></li><li>ที่ i=10% คิดลดที่ดินและ WC เป็น 10+30/1.1²=34.793 ล้าน; จุดคืน FCI<sub>L</sub> คือ cumulative discounted CF =−34.793 ล้าน → DPBP≈<b>5.94 ปีหลัง start-up</b></li><li>หากรวมกระแสทั้งโครงการที่ i=10% จะได้ NPV≈<b>17.12 ล้าน</b> และ PVR≈<b>1.10</b>; CCP≈170.50 ล้านเมื่อไม่คิดลด</li></ol>
<div class="warning">ในตารางสไลด์บางแถวมีตัวเลขสะสมไม่สอดคล้องกัน เช่น discounted cumulative สิ้นปี 4 ที่คำนวณจาก CF ในตารางได้ประมาณ −105.80 ล้าน ขณะที่สไลด์พิมพ์ −103.80; ควรตรวจจากแต่ละรายการแทนการบวกตัวเลขที่พิมพ์โดยตรง</div>`},
{id:'npv-pvr',chapter:'10.1',title:'NPV และ PVR: เงินต่างเวลาต้องย้ายก่อน',topic:'NPV และ PVR',pages:'10.1 หน้า 14–20; ข้อสอบ 2025 ข้อ 30',read:'10 นาที',html:`
<p>Discounted analysis นำทุกกระแสไปเทียบ ณ เวลา 0 โดยใช้อัตราที่เหมาะสม เช่น MARR</p><div class="formula">NPV = Σ CF<sub>t</sub>/(1+i)<sup>t</sup><br>PVR = PV ของกระแสเงินสดบวก / ขนาด PV ของกระแสเงินสดลบ</div>
<p>ลงทุน 100 วันนี้ รับ 60 สิ้นปี 1 และ 60 สิ้นปี 2 ที่ i=10%: NPV=−100+60/1.10+60/1.10²=<b>+4.13</b>; PV เงินเข้า =104.13 และ PVR=104.13/100=<b>1.0413</b></p><p>โครงการเดี่ยวเมื่อกำหนด MARR: NPV&gt;0 คุ้มตามเกณฑ์, NPV=0 เท่าทุนบนฐาน MARR, NPV&lt;0 ไม่ผ่าน และ PVR มากกว่า 1 เทียบเท่า NPV บวกเมื่อใช้ฐานกระแสเดียวกัน</p><h3>โจทย์สอบเก่าที่อัตราและงวดไม่ตรงกัน</h3><p>อัตรา nominal 23% ต่อ 2 ปี ทบรายไตรมาส → สองปีมี 8 ไตรมาส จึง i ต่อไตรมาส = 0.23/8 = 2.875% และ effective ต่อปี = (1.02875)⁴−1 ≈ 12.0055% แล้วจึงใช้กับ CF รายปี ถ้าลงทุน 70,000 รับสุทธิ 12,150 ต่อปี 10 ปี จะได้ NPV ≈ <b>−1,365.28 ดอลลาร์</b>; ช้อยส์ข้อสอบเก่า −1,350 เป็นค่าที่ใกล้เมื่อปัดอัตราเป็น 12%</p><div class="tip">เงิน CF₀ ไม่ต้องคิดลด และเครื่องหมายเงินเข้า–ออกต้องสอดคล้องทั้งโจทย์</div>`},
{id:'discounted-payback',chapter:'10.1',title:'DPBP: คืนทุนเมื่อคิดดอกเบี้ย',topic:'ระยะคืนทุน DPBP',pages:'10.1 หน้า 15, 21–24, 34–45; ข้อสอบ 2025 ข้อ 27',read:'10 นาที',html:`
<p><b>DPBP</b> คิดลด cash flow แต่ละงวดก่อนสะสม แล้วหาจุดคืนฐานที่โจทย์กำหนด โดยปกติสำหรับกระแสรับบวกชุดเดียวกัน DPBP จะไม่สั้นกว่า PBP เมื่อ i&gt;0</p><div class="formula">มูลค่าปัจจุบัน CF ปี t = CF<sub>t</sub>/(1+i)<sup>t</sup><br>DPBP ≈ ปีเต็มก่อนถึงเป้า + ส่วนที่ขาด / discounted CF ปีถัดไป</div>
<h3>ตัวอย่าง</h3><p>ลงทุน 100 ที่ t=0 และรับ 60 สิ้นปี 1, 60 สิ้นปี 2 ที่ 10%: PV₁=54.55, PV₂=49.59; สิ้นปี 1 ยังขาด 45.45 → DPBP ≈ 1+45.45/49.59 = <b>1.92 ปี</b> หากใช้การประมาณเชิงเส้น; หากรับเงินเป็นก้อนสิ้นปีจริงจุดคืนทุนอยู่สิ้นปี 2</p><p>กรณีฐานคือ FCI<sub>L</sub> เท่านั้น ให้แยกที่ดิน/WC ตามนิยาม และต้องเทียบมูลค่าที่เวลาอ้างอิงเดียวกัน อย่าใช้ยอด undiscounted ไปเทียบกับ discounted โดยไม่ปรับ</p><div class="tip">ถ้าผลรวม discounted CF ตลอดระยะโครงการยังไม่ถึงฐานที่กำหนด ให้ตอบว่าไม่คืนทุนภายในอายุโครงการ</div>`},
{id:'irr-marr',chapter:'10.1',title:'DCFROR, IRR และ MARR',topic:'DCFROR และ MARR',pages:'10.1 หน้า 22, 25–33',read:'10 นาที',html:`
<p><b>DCFROR หรือ IRR</b> คืออัตรา i* ที่ทำให้ NPV ของกระแสเงินสดที่กำหนดเท่ากับศูนย์ ส่วน <b>MARR</b> คืออัตราผลตอบแทนขั้นต่ำที่ใช้ตัดสินใจ</p><div class="formula">0 = Σ CF<sub>t</sub>/(1+i*)<sup>t</sup><br>โครงการทั่วไปที่ลงทุนก่อนและรับเงินภายหลัง: i* &gt; MARR → ผ่านเกณฑ์ผลตอบแทน</div>
<h3>ตัวอย่างจากสไลด์</h3><p>จ่าย 1,000 ที่ t=0 รับ 500 ที่ปี 3 และ 1,500 ที่ปี 5: ตั้ง 0=−1,000+500/(1+i*)³+1,500/(1+i*)⁵ แล้วลองอัตราหรือ interpolate ได้ i*≈<b>16.90%</b> ต่อปี</p><p>ถ้า MARR=10% โครงการผ่านเกณฑ์อัตราผลตอบแทน; ถ้า MARR=20% ไม่ผ่าน ทั้งนี้ยังต้องดูข้อจำกัดอื่น เช่น ระยะคืนทุน</p><div class="warning">กระแสเงินสดที่เปลี่ยนเครื่องหมายหลายครั้งอาจมีหลาย IRR หรือไม่มี IRR ให้ตรวจ NPV profile และบริบท ไม่ใช้กฎ IRR อย่างไม่มีเงื่อนไข</div>`},
{id:'exam-plant',chapter:'10.1',title:'แกะข้อสอบเก่า: โรงงาน 22 ล้าน',topic:'ข้อสอบโรงงาน 2025',pages:'ข้อสอบปลายภาค 2025 หน้า 8–9; 10.1 หน้า 10–25',read:'12 นาที',html:`
<p>โจทย์ให้ FCI รวมที่ดิน 22 ล้าน โดยที่ดิน 2 ล้าน; WC=10% ของเงินลงทุนรวมที่ไม่รวมที่ดิน; อายุ 10 ปี, S=0.5, SL, ภาษี 30%, i=10%</p><ol><li>FCI<sub>L</sub>=22−2=<b>20 ล้าน</b>; WC=0.10(20+WC) → WC=2.222 ล้าน; เงินออกเริ่มต้นทั้งหมด=24.222 ล้าน</li><li>SL d=(20−0.5)/10=<b>1.95 ล้าน/ปี</b></li><li>ปี 1–3: R=7 และ COMd=2 → CF=(7−2−1.95)(0.70)+1.95=<b>4.085 ล้าน/ปี</b></li><li>ปี 4–10: R=8 → CF=(8−2−1.95)(0.70)+1.95=<b>4.785 ล้าน/ปี</b> ก่อนรายการสุดท้าย</li><li>ตามวิธีเฉลยข้อสอบ ปี 10 รวมคืนที่ดิน 2, WC 2.222 และซากหลังภาษี 0.35 → CF ปี 10 ≈9.357 ล้าน; NPV ที่ 10% ≈<b>5.20 ล้าน</b>; IRR≈<b>14.33%</b></li></ol>
<p>DPBP เฉลยประมาณ <b>6.37 ปี</b> ใช้นิยามคืน FCI<sub>L</sub> โดยแยกที่ดินและ WC: สิ้นปี 6 discounted cumulative≈−5.123, สิ้นปี 7≈−2.668, เป้าหมาย=−4.222 → 6+(5.123−4.222)/(5.123−2.668)≈6.37 ปี หากนับคืน <b>เงินลงทุนทั้งหมด</b> เป้าหมายเป็น 0 จะได้ประมาณ <b>8.21 ปี</b></p>
<div class="warning">ข้อสอบนับราคาซาก 0.5 เป็นรายรับปีสุดท้ายและหักภาษี 30% ทั้งจำนวนตามตาราง ถ้าโจทย์อื่นคิดภาษีเฉพาะกำไรขายซากเทียบกับ BV ผลจะต่างกัน ต้องใช้เงื่อนไขที่กำหนด</div>`},
{id:'exclusive-projects',chapter:'10.2',title:'โครงการเดี่ยวและทางเลือกที่เลือกได้หนึ่งเดียว',topic:'การเลือกโครงการ',pages:'10.2 หน้า 2–4, 7, 12–13',read:'8 นาที',html:`
<p><b>โครงการเดี่ยว</b> เทียบกับไม่ลงทุน: ที่ MARR ถ้า NPV&gt;0 ผ่านเกณฑ์มูลค่า หากเลือกไม่ลงทุนได้</p><p><b>Mutually exclusive</b> คือเลือกได้ไม่เกินหนึ่งทางเลือก เช่น เลือกปั๊ม A หรือ B ที่ให้บริการเดียวกัน เมื่อใช้ช่วงวิเคราะห์และสมมติฐานเดียวกัน ให้เลือก <b>NPV สูงที่สุด</b> ที่ผ่านข้อจำกัด โดยอย่าตัดสินจาก IRR รายโครงการที่สูงที่สุดเพียงอย่างเดียว</p><div class="formula">โครงการรายรับสุทธิ: เลือก NPV สูงสุด<br>ทางเลือกที่มีแต่ต้นทุน: เลือก PV ต้นทุนที่มีขนาดต่ำสุด หรือ NPV ที่ติดลบน้อยสุด</div><div class="tip">ถ้าเป็นบริการที่จำเป็นต้องทำ อาจไม่มีตัวเลือก “ไม่ทำ” แม้ทั้งสอง NPV ติดลบ เพราะตัวเลขนั้นเป็นต้นทุน ไม่ได้แปลว่าควรยกเลิกบริการเสมอ</div>`},
{id:'equal-life',chapter:'10.2',title:'เทียบ NPV เมื่ออายุเท่ากัน',topic:'NPV อายุเท่ากัน',pages:'10.2 หน้า 13–15',read:'9 นาที',html:`
<p>ถ้าบริการ อายุ และขอบเขตเท่ากัน เปรียบเทียบที่เวลาอ้างอิงเดียวกันด้วยอัตราเดียวกันได้โดยตรง</p><div class="formula">NPV = −C − O(P/A,i,n) + S(P/F,i,n)<br>หรือ PV cost = C + O(P/A,i,n) − S(P/F,i,n)</div>
<h3>คอนเดนเซอร์จากสไลด์: n=12, i=10%</h3><p>A ต้นทุน 23,000 ค่าเดินเครื่อง 1,500/ปี → NPV≈−33,220.54 ดอลลาร์; B ต้นทุน 12,000 ค่าเดินเครื่อง 3,000/ปี → NPV≈−32,441.08 ดอลลาร์ จึงเลือก <b>B</b> เพราะ NPV สูงกว่า หรือค่าใช้จ่ายปัจจุบันต่ำกว่า</p><div class="tip">ตัวเลข −32,441 สูงกว่า −33,221 แม้ค่าบวก 32,441 จะมีขนาดต้นทุนน้อยกว่า</div>`},
{id:'incremental',chapter:'10.2',title:'Incremental NPV และ Incremental ROR',topic:'วิเคราะห์ส่วนเพิ่ม',pages:'10.2 หน้า 5–12; ข้อสอบ 2025 ข้อ 9–11',read:'11 นาที',html:`
<p>ใช้เมื่อต้องเลือกระหว่างทางเลือกที่ลงทุนไม่เท่ากัน คำถามคือ <b>เงินที่จ่ายเพิ่มเพื่อเปลี่ยนไปทางเลือกแพงกว่า คุ้มค่าหรือไม่?</b></p><ol><li>เรียงตามเงินลงทุนเริ่มต้นจากน้อยไปมาก</li><li>ตั้งกระแสส่วนเพิ่ม = กระแสทางเลือกแพงกว่า − กระแสทางเลือกถูกกว่า ในทุกเวลา</li><li>หา ΔNPV ที่ MARR หรือหา ΔIRR จากสมการ ΔNPV=0</li><li>สำหรับส่วนเพิ่มแบบลงทุนก่อน–รับประโยชน์ภายหลัง: ΔNPV&gt;0 หรือ ΔIRR&gt;MARR → ทางเลือกแพงกว่าคุ้ม; ถ้าต่ำกว่าให้เลือกฐานเดิม</li></ol><div class="formula">ΔCF<sub>t</sub> = CF<sub>challenger,t</sub> − CF<sub>defender,t</sub><br>ΔNPV = NPV<sub>challenger</sub> − NPV<sub>defender</sub></div>
<div class="warning">ต้องเทียบช่วงเวลาและบริการให้สอดคล้องกัน ถ้าอายุไม่เท่ากันให้ใช้ช่วงศึกษาร่วมหรือสมมติฐานทำซ้ำให้เหมาะสม และถ้ากระแสส่วนเพิ่มไม่เป็นแบบปกติ IRR อาจตีความไม่ได้โดยตรง</div>`},
{id:'three-projects',chapter:'10.2',title:'ตัวอย่างเลือก A, B, C จากสไลด์',topic:'โจทย์เปรียบเทียบโครงการ',pages:'10.2 หน้า 3–6',read:'10 นาที',html:`
<p>งบสูงสุด 120 ล้าน; A ลงทุน 60 มี NPV=11.9, B ลงทุน 120 NPV=15.2, C ลงทุน 100 NPV=15.9 (ล้านดอลลาร์) ที่ MARR 10%; เป็นโครงการเลือกได้อย่างเดียว</p><ol><li>A มี NPV บวก จึงใช้เป็นฐาน</li><li>เทียบ C−A: ลงทุนเพิ่ม 40, เงินเพิ่มปี 1 =2, ปี 2–10 =8 ต่อปี → ΔNPV=−40+2/1.1+8(P/A,10%,9)/1.1≈<b>+3.70 ล้าน</b> จึงเปลี่ยนฐานเป็น C</li><li>เทียบ B−C: ลงทุนเพิ่ม 20, ปี 1 เพิ่ม 10, ปี 2–10 เพิ่ม 2 ต่อปี → ΔNPV≈<b>−0.44 ล้าน</b> จึงคง C</li></ol><p>ผลสอดคล้องกับการเลือก NPV สูงสุดคือ <b>C</b> แม้ A จะมี IRR รายโครงการสูงกว่า</p><div class="tip">ΔIRR C−A≈11.91% และ B−C≈9.28% จากข้อมูลกระแสเงินสดตามสไลด์; สไลด์ระบุประมาณ 11.9% และ 9.4% ตามลำดับ</div>`},
{id:'eaoc',chapter:'10.2',title:'EAOC: เปรียบเทียบค่าใช้จ่ายต่อปี',topic:'EAOC และ AW',pages:'10.2 หน้า 16–20, 32–34',read:'10 นาที',html:`
<p>เมื่ออายุอุปกรณ์ไม่เท่ากัน วิธี Equivalent Annual Operating Cost แปลงต้นทุนแต่ละทางเลือกเป็นค่าใช้จ่ายรายปีเทียบเท่า โดยใช้สมมติฐานการทำซ้ำและบริการเท่าเดิมตามที่เหมาะกับโจทย์</p><div class="formula">EAOC = C(A/P,i,n) + O &nbsp; เมื่อ S=0<br>(A/P,i,n)=i(1+i)<sup>n</sup>/[(1+i)<sup>n</sup>−1]</div>
<h3>ตัวอย่างปั๊มในสไลด์</h3><p>A: C=8,000, O=1,800/ปี, n=4; B: C=16,000, O=1,600/ปี, n=7; i=8%</p><ol><li>EAOC<sub>A</sub>=8,000(A/P,8%,4)+1,800≈<b>4,215.37 ดอลลาร์/ปี</b></li><li>EAOC<sub>B</sub>=16,000(A/P,8%,7)+1,600≈<b>4,673.16 ดอลลาร์/ปี</b></li><li>เลือก A เพราะต้นทุนต่อปีต่ำกว่า สไลด์ปัดเป็นประมาณ 4,220 และ 4,670</li></ol><div class="tip">EAOC ในที่นี้เขียนเป็นค่าบวกซึ่งหมายถึง “ขนาดต้นทุน” จึงเลือกตัวเลขต่ำสุด</div>`},
{id:'salvage-eaoc',chapter:'10.2',title:'EAOC เมื่อมีมูลค่าซาก',topic:'EAOC และมูลค่าซาก',pages:'10.2 หน้า 16–20; ข้อสอบ 2025 ข้อวัสดุ',read:'8 นาที',html:`
<p>มูลค่าซากเป็นเงินรับเมื่อสิ้นอายุ จึงลดต้นทุนรายปีเทียบเท่า</p><div class="formula">EAOC = C(A/P,i,n) − S(A/F,i,n) + O<br>= (C−S)(A/P,i,n) + Si + O</div>
<p>ตัวอย่าง C=10,000, S=2,000, n=5, i=10%, O=1,000 ต่อปี: EAOC =10,000(A/P,10%,5)−2,000(A/F,10%,5)+1,000 ≈ <b>3,310.38 ดอลลาร์/ปี</b></p><div class="tip">S ไม่ใช่เงินที่ได้รับ ณ วันนี้: ถ้าใช้ PW ต้องคิดลด S กลับจากปี n ก่อน</div>`},
{id:'lcm',chapter:'10.2',title:'อายุต่างกัน: Common Denominator และ LCM',topic:'อายุต่างกันและ LCM',pages:'10.2 หน้า 21–27; ข้อสอบ 2025 ข้อวัสดุ',read:'10 นาที',html:`
<p>ถ้าเลือกใช้ Present Worth กับอายุต่างกัน ต้องเปรียบเทียบบริการในช่วงศึกษาเดียวกัน เช่น ทำซ้ำถึง ค.ร.น. ของอายุ เมื่อโจทย์สมมติว่าอุปกรณ์ถูกทดแทนและมีต้นทุน/บริการเหมือนเดิมทุกรอบ</p><p>อายุ 2 ปี กับ 4 ปี → ค.ร.น.=4 ปี อุปกรณ์ 2 ปีต้องซื้อที่ปี 0 และปี 2 และมีซากปลายแต่ละรอบ</p><h3>ข้อสอบวัสดุปี 2025 ที่ i=10%</h3><p>A: ซื้อ 205,000, O=29,000/ปี, S=2,000, อายุ 2 ปี; B: ซื้อ 235,000, O=27,000/ปี, S=20,000, อายุ 4 ปี</p><div class="formula">PW<sub>A</sub>=−205,000−29,000(P/A,10%,4)<br>−(205,000−2,000)(P/F,10%,2)+2,000(P/F,10%,4) ≈ −463,328.67<br>PW<sub>B</sub>=−235,000−27,000(P/A,10%,4)+20,000(P/F,10%,4) ≈ −306,926.10</div><p>เลือก B เพราะ NPV ติดลบน้อยกว่า เฉลยต้นฉบับมีการปัด factor จึงต่างเล็กน้อย</p><div class="warning">LCM ไม่จำเป็นเสมอ: หากโจทย์กำหนดช่วงโครงการจำกัดหรือทดแทนไม่เหมือนเดิม ให้ใช้ช่วงศึกษาที่กำหนดและมูลค่าคงเหลือที่เหมาะสม</div>`},
{id:'aw-repeat',chapter:'10.2',title:'AW และการทำซ้ำหลายรอบ',topic:'AW และการทำซ้ำ',pages:'10.2 หน้า 16–21; ข้อสอบ 2025 ข้อ 1, 12–14',read:'8 นาที',html:`
<p>Annual Worth (AW) คือจำนวนรายปีเท่ากันที่เทียบเท่ากับมูลค่าโครงการ เมื่ออายุไม่เท่ากันสามารถหา AW ของหนึ่งรอบแต่ละทางเลือกแล้วเทียบได้ หากบริการและรูปแบบการทดแทนซ้ำเหมือนเดิม</p><div class="formula">AW = PW ของหนึ่งรอบ × (A/P,i,n)<br>AW ของต้นทุนเป็นลบ → เลือกค่าที่สูงกว่า / ติดลบน้อยกว่า<br>EAOC เขียนเป็นต้นทุนบวก → เลือกค่าต่ำกว่า</div>
<p>ภายใต้สมมติฐานรอบซ้ำเหมือนกัน AW ที่หาในหนึ่งรอบเท่ากับ AW ของ 2 หรือ 3 รอบ ไม่จำเป็นต้องขยายถึง ค.ร.น. เพื่อหา AW แต่ถ้าราคาซื้อหรือค่าเดินเครื่องรอบใหม่เปลี่ยนไป ผลนี้ไม่อัตโนมัติ</p><div class="tip">เปรียบเทียบ Future Worth ของคนละอายุที่คนละเวลาตรง ๆ ไม่ได้ ต้องย้ายไปเวลาเดียวกันก่อน</div>`},
{id:'capitalized-cost',chapter:'10.2',title:'Capitalized Cost: ต้นทุนของบริการตลอดไป',topic:'Capitalized cost',pages:'10.2 หน้า 28–31, 33; ข้อสอบ 2025 ข้อ 13, 15',read:'11 นาที',html:`
<p>Capitalized Cost คือ <b>มูลค่าปัจจุบัน</b> ของบริการที่ดำเนินและทดแทนต่อเนื่องตลอดไป ภายใต้อัตรา i&gt;0 และสมมติฐานที่กำหนด ไม่ใช่ค่าใช้จ่ายรายปี</p><div class="formula">เปลี่ยนเครื่องราคา C ทุก n ปี ไม่มีซาก:<br>CC = C + C/[(1+i)<sup>n</sup>−1]<br>รวมค่าเดินเครื่อง O ต่อปีตลอดไป: ECC = CC + O/i</div><p>สูตรเกิดจากเงินก้อนสำรอง R ที่มีดอกเบี้ยสะสม n ปีพอจ่ายเครื่องใหม่: R[(1+i)ⁿ−1]=C จากนั้น CC=C+R และค่า O ตลอดไปคิดเป็น O/i</p><h3>ตัวอย่างปั๊ม</h3><p>A: C=8,000, n=4, O=1,800, i=8% → ECC≈<b>52,692.08 ดอลลาร์</b>; B: C=16,000, n=7, O=1,600 → ECC≈<b>58,414.48 ดอลลาร์</b> จึงเลือก A ซึ่งสอดคล้องกับ EAOC เมื่อใช้สมมติฐานเดียวกัน</p><div class="tip">สำหรับโครงการถาวรที่ลงทุนเริ่มต้น C และบำรุง O ต่อปีอย่างเดียว ค่าใช้จ่ายรายปีเทียบเท่า = Ci+O ส่วน capitalized cost = C+O/i</div>`},
{id:'selection-summary',chapter:'10.2',title:'เลือกเครื่องมือให้ตรงโจทย์',topic:'เลือกวิธีวิเคราะห์',pages:'10.2 หน้า 2, 12, 16–34; ข้อสอบ 2025',read:'7 นาที',html:`
<div class="table-wrap"><table><thead><tr><th>ลักษณะโจทย์</th><th>วิธีที่เหมาะ</th><th>ตัดสินอย่างไร</th></tr></thead><tbody><tr><td>โครงการเดียว</td><td>NPV หรือ IRR ที่ MARR</td><td>NPV ≥ 0; IRR ≥ MARR ภายใต้เงื่อนไขกระแสปกติ</td></tr><tr><td>ต้องเลือกหนึ่งเดียว อายุเท่ากัน</td><td>NPV หรือ incremental</td><td>เลือก NPV สูงสุดที่ทำได้</td></tr><tr><td>อายุต่างกัน ทดแทนซ้ำ</td><td>EAOC/AW หรือ PW ช่วง LCM</td><td>เลือกต้นทุนรายปีต่ำสุด</td></tr><tr><td>บริการต่อเนื่องตลอดไป</td><td>Capitalized cost</td><td>เลือก PV ต้นทุนต่ำสุด</td></tr></tbody></table></div>
<p>ถ้าต้องลงทุนเพิ่มเพื่อประหยัดค่าเดินเครื่อง ให้เปรียบเทียบผลประหยัดส่วนเพิ่มกับเงินลงทุนส่วนเพิ่ม ไม่ควรเลือกเครื่องราคาถูกที่สุดโดยดูเพียงราคาแรกซื้อ</p><div class="warning">ผลของแต่ละวิธีจะสอดคล้องกันเมื่อใช้กระแสเงินสด ระยะศึกษา อัตรา และสมมติฐานการทดแทนเดียวกัน</div>`},
];

<script>// Safe arithmetic parser for the course calculator: no eval or network calls.
function calcGcd(a,b){a=a<0n?-a:a;b=b<0n?-b:b;while(b){const r=a%b;a=b;b=r}return a||1n}
function calcRational(n,d){if(d===0n)throw Error('หารด้วยศูนย์ไม่ได้');if(d<0n){n=-n;d=-d}if(n.toString().length>150||d.toString().length>150)return null;const g=calcGcd(n,d);return {n:n/g,d:d/g}}
function calcNumberFraction(raw){
 const m=raw.toLowerCase().match(/^(\d*\.?\d+|\d+\.)(?:e([+-]?\d+))?$/);if(!m)return null;
 const bits=m[1].split('.'),digits=(bits[0]||'0')+(bits[1]||''),exponent=Number(m[2]||0)-(bits[1]||'').length;
 if(digits.length>80||Math.abs(exponent)>80)return null;
 let n=BigInt(digits||'0'),d=1n;if(exponent>=0)n*=10n**BigInt(exponent);else d=10n**BigInt(-exponent);return calcRational(n,d);
}
function calcApply(op,a,b){
 let value,r=null;
 if(op==='+'){value=a.value+b.value;if(a.r&&b.r)r=calcRational(a.r.n*b.r.d+b.r.n*a.r.d,a.r.d*b.r.d)}
 else if(op==='-'){value=a.value-b.value;if(a.r&&b.r)r=calcRational(a.r.n*b.r.d-b.r.n*a.r.d,a.r.d*b.r.d)}
 else if(op==='*'){value=a.value*b.value;if(a.r&&b.r)r=calcRational(a.r.n*b.r.n,a.r.d*b.r.d)}
 else if(op==='/'){if(b.value===0)throw Error('หารด้วยศูนย์ไม่ได้');value=a.value/b.value;if(a.r&&b.r)r=calcRational(a.r.n*b.r.d,a.r.d*b.r.n)}
 else if(op==='^'){
  value=(a.value<0&&b.r&&b.r.d%2n===1n)?(b.r.n%2n===0n?1:-1)*Math.pow(-a.value,b.value):Math.pow(a.value,b.value);
  if(a.r&&b.r&&b.r.d===1n&&b.r.n>=-50n&&b.r.n<=50n){const n=b.r.n<0n?-b.r.n:b.r.n;const nn=a.r.n**n,dd=a.r.d**n;r=b.r.n<0n?calcRational(dd,nn):calcRational(nn,dd)}
 }
 if(!Number.isFinite(value))throw Error('ผลลัพธ์อยู่นอกช่วงที่คำนวณได้');
 if(r){const rn=Number(r.n),rd=Number(r.d);if(Number.isFinite(rn)&&Number.isFinite(rd))value=rn/rd}
 return {value,r};
}
function calculateExpression(input){
 const src=String(input).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').trim();if(!src)throw Error('กรุณาใส่ตัวเลข');if(src.length>300)throw Error('นิพจน์ยาวเกินไป');
 const tokens=[];let i=0;while(i<src.length){if(/\s/.test(src[i])){i++;continue}const chunk=src.slice(i),m=chunk.match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/);if(m){const v=Number(m[0]);if(!Number.isFinite(v))throw Error('ตัวเลขมากเกินไป');tokens.push({type:'number',text:m[0],value:v});i+=m[0].length;continue}if('+-*/^()'.includes(src[i])){tokens.push({type:src[i]});i++;continue}throw Error('มีสัญลักษณ์ที่เครื่องคิดเลขไม่รองรับ')}
 let at=0;const peek=()=>tokens[at]?.type;
 function primary(){const t=tokens[at];if(!t)throw Error('นิพจน์ยังไม่ครบ');if(t.type==='number'){at++;return {value:t.value,r:calcNumberFraction(t.text)}}if(t.type==='('){at++;const v=sum();if(peek()!==')')throw Error('วงเล็บยังไม่ครบ');at++;return v}throw Error('ตรวจตำแหน่งตัวเลขหรือเครื่องหมาย')}
 function power(){let v=primary();if(peek()==='^'){at++;v=calcApply('^',v,unary())}return v}
 function unary(){if(peek()==='+'||peek()==='-'){const op=tokens[at++].type,v=unary();if(op==='-')return {value:-v.value,r:v.r?{n:-v.r.n,d:v.r.d}:null};return v}return power()}
 function product(){let v=unary();while(peek()==='*'||peek()==='/'){let op=tokens[at++].type;v=calcApply(op,v,unary())}return v}
 function sum(){let v=product();while(peek()==='+'||peek()==='-'){let op=tokens[at++].type;v=calcApply(op,v,product())}return v}
 const result=sum();if(at!==tokens.length)throw Error('ตรวจตำแหน่งตัวเลขหรือวงเล็บ');if(!Number.isFinite(result.value))throw Error('ผลลัพธ์อยู่นอกช่วงที่คำนวณได้');return result;
}
function calcFormat(n){if(Object.is(n,-0)||n===0)return '0';return Number(n.toPrecision(12)).toString()}
function calcFractionText(r){if(!r||r.d===1n)return '';const text=`${r.n}/${r.d}`;return text.length<=60?text:''}

  }

<script>// A simple per-question scratch sheet. Strokes are stored locally in IndexedDB.

 sheet.chain=sheet.chain.catch(()=>{}).then(()=>padDatabase()).then(db=>new Promise(resolve=>{
  if(!db){if(!padStorageWarned){padStorageWarned=true;toast('กระดาษทดบันทึกไม่ได้ แต่ยังใช้ได้ชั่วคราวในหน้านี้')}resolve();return}

 }));
}
function scratchMarkup(){

 const eraser='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 17.8 3.8 13.4a1.8 1.8 0 0 1 0-2.55l6.95-6.96a1.8 1.8 0 0 1 2.55 0l6.9 6.9a1.8 1.8 0 0 1 0 2.55l-4.45 4.46H8.2Zm-2.4-6.4 6.1 6.1M8.2 18.4h12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

}
function teardownScratch(){if(padCleanup){padCleanup();padCleanup=null}}
function mountScratch(key){

 function point(ev){const r=canvas.getBoundingClientRect();return [Math.round((ev.clientX-r.left)*10)/10,Math.round((ev.clientY-r.top)*10)/10]}

  if(!sheet.loaded||pointer!==null||(ev.pointerType==='mouse'&&ev.button!==0))return;ev.preventDefault();pointer=ev.pointerId;try{canvas.setPointerCapture(pointer)}catch{}
  stroke={tool:toolNow(),points:[point(ev)]};sheet.strokes.push(stroke);paint(stroke,stroke.points[0]);

  if(pointer!==ev.pointerId||!stroke)return;ev.preventDefault();const events=typeof ev.getCoalescedEvents==='function'?ev.getCoalescedEvents():[];const samples=events.length?events:[ev];
  for(const sample of samples){const next=point(sample),prev=stroke.points[stroke.points.length-1];if(Math.hypot(next[0]-prev[0],next[1]-prev[1])<0.8)continue;stroke.points.push(next);paint(stroke,prev,next)}
 }
 function finish(ev){if(pointer!==ev.pointerId||!stroke)return;ev.preventDefault();pointer=null;stroke=null;savePadSheet(sheet)}
 canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);canvas.addEventListener('lostpointercapture',finish);
 const buttons=[...layout.querySelectorAll('[data-pad-tool]')];
 function selectTool(ev){const button=ev.currentTarget,tool=button.dataset.padTool;if(!PAD_TOOLS[tool])return;state.paperTool=tool;save();for(const b of buttons){let on=b.dataset.padTool===tool;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))}canvas.classList.toggle('erasing',tool==='eraser')}
 for(const b of buttons)b.addEventListener('click',selectTool);

 function splitBounds(){const width=layout.getBoundingClientRect().width,divider=splitter.getBoundingClientRect().width;const minLeft=Math.min(300,Math.max(105,width*0.25)),minRight=Math.min(265,Math.max(105,width*0.25));return {width,min:minLeft/width,max:(width-divider-minRight)/width}}
 function applySplit(value,persist=false){const b=splitBounds();if(!b.width)return;const ratio=Math.max(b.min,Math.min(b.max,value));currentSplit=ratio;layout.style.setProperty('--paper-split',`${ratio*100}%`);splitter.setAttribute('aria-valuemin',String(Math.round(b.min*100)));splitter.setAttribute('aria-valuemax',String(Math.round(b.max*100)));splitter.setAttribute('aria-valuenow',String(Math.round(ratio*100)));if(persist){state.paperSplit=ratio;save()}}

<script>'use strict';
const KEY='econprep_quiz2_10_1_10_2_v1';
const $=s=>document.querySelector(s), main=$('#main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({stats:{},bookmarks:[],learned:[],practice:null,exam:null,round:0});
let state;
try{state={...initial(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=initial()}
if(!state.stats||typeof state.stats!=='object')state.stats={};
if(!Array.isArray(state.bookmarks))state.bookmarks=[];
if(!Array.isArray(state.learned))state.learned=[];
let view='home', lessonId=LESSONS[0].id, reviewFilter='all', timer=null, bankFilter={query:'',chapter:'all',topic:'all'},confirmExamSubmit=false,confirmRestart=false,confirmPracticeReset=false;
const letters=['A','B','C','D'];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('ไม่สามารถบันทึกในเบราว์เซอร์นี้ได้')}}
let toastTimer;
function toast(message){const el=$('#toast');el.textContent=message;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',3000)}
function shuf(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function find(id){return QUESTIONS.find(q=>q.id===id)}
// Keep existing progress, removing obsolete questions and safely adapting unfinished sessions.
function migrateScope(){
 const valid=new Set(QUESTIONS.map(q=>q.id)),validLessons=new Set(LESSONS.map(l=>l.id)),oldStats=state.stats;
 state.bookmarks=state.bookmarks.filter(id=>valid.has(id));state.learned=state.learned.filter(id=>validLessons.has(id));
 const p=state.practice;
 if(p&&Array.isArray(p.ids)&&p.ids.some(id=>!valid.has(id))){
  const oldIds=p.ids.slice(),index=Math.max(0,Math.min(p.index,oldIds.length-1)),current=oldIds[index];
  const removedAnswered=oldIds.filter((id,i)=>!valid.has(id)&&(i<index||(i===index&&p.revealed)));
  p.answered=Math.max(0,(p.answered||0)-removedAnswered.length);
  p.correct=Math.max(0,(p.correct||0)-removedAnswered.filter(id=>oldStats[id]?.lastCorrect===true).length);
  p.ids=oldIds.filter(id=>valid.has(id));p.index=oldIds.slice(0,index).filter(id=>valid.has(id)).length;
  if(!valid.has(current)){p.selected=null;p.revealed=false}
  if(!p.ids.length)state.practice=null;
  else if(p.index>=p.ids.length){p.index=p.ids.length-1;p.finished=true;p.answered=p.ids.length}
 }
 const e=state.exam;
 if(e&&Array.isArray(e.ids)&&e.ids.some(id=>!valid.has(id))){
  e.answers=e.answers||{};e.orders=e.orders||{};
  if(e.finished){for(const id of e.ids.filter(id=>!valid.has(id)))delete e.answers[id];e.ids=e.ids.filter(id=>valid.has(id));e.score=e.ids.reduce((n,id)=>n+(e.answers[id]===find(id).correct?1:0),0);if(!e.ids.length)state.exam=null}
  else for(let i=0;i<e.ids.length;i++){const oldId=e.ids[i];if(valid.has(oldId))continue;const candidates=QUESTIONS.filter(q=>q.chapter==='10.2'&&!e.ids.includes(q.id));if(!candidates.length){state.exam=null;break}const replacement=shuf(candidates)[0].id;e.ids[i]=replacement;delete e.answers[oldId];delete e.orders[oldId];e.orders[replacement]=shuf([0,1,2,3])}
 }

}
migrateScope();
function stat(id){return state.stats[id]||{attempts:0,correct:0,lastCorrect:null}}
function record(id,isCorrect){const s=stat(id);state.stats[id]={attempts:s.attempts+1,correct:s.correct+(isCorrect?1:0),lastCorrect:isCorrect};}
function summary(){const vals=Object.values(state.stats);let attempts=vals.reduce((n,x)=>n+(x.attempts||0),0),right=vals.reduce((n,x)=>n+(x.correct||0),0);return {seen:QUESTIONS.filter(q=>stat(q.id).attempts>0).length,weak:QUESTIONS.filter(q=>stat(q.id).lastCorrect===false).length,attempts,right,accuracy:attempts?Math.round(right/attempts*100):null}}
function setView(v,{focus=true}={}){teardownScratch();if(v!=='practice'&&v!=='exam')closeCalculator();clearInterval(timer);view=v;document.querySelectorAll('.nav').forEach(x=>{let nav=x.dataset.view;let active=nav===v||(nav==='learn'&&v==='lesson')||(nav==='practiceStart'&&['practice','practiceDone'].includes(v))||(nav==='examSetup'&&['exam','result'].includes(v));x.classList.toggle('active',active);if(active)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});render();if(focus){main.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}}
function goTop(){window.scrollTo({top:0,behavior:'instant'});main.focus({preventScroll:true})}

function startPractice(mode='all',chapter='all',topic='',force=false,singleId=''){
 if(state.practice&&!state.practice.finished&&!force){pendingPractice={mode,chapter,topic,singleId};confirmPracticeReset=true;setView('practiceStart');return}
 let pool=QUESTIONS.filter(q=>(chapter==='all'||q.chapter===chapter)&&(!topic||q.topic===topic));
 if(mode==='weak')pool=pool.filter(q=>stat(q.id).lastCorrect===false);if(mode==='saved')pool=pool.filter(q=>state.bookmarks.includes(q.id));if(mode==='single')pool=pool.filter(q=>q.id===singleId);

 state.practice={mode,chapter,topic,ids,orders,index:0,selected:null,revealed:false,finished:false,correct:0,answered:0,started:Date.now()};state.round++;confirmPracticeReset=false;pendingPractice=null;save();setView('practice');

function nextPractice(){const p=state.practice;if(!p||!p.revealed)return;if(p.index===p.ids.length-1){p.finished=true;save();setView('practiceDone');return}p.index++;p.selected=null;p.revealed=false;save();practice();goTop()}
function topicSelection(pool,count){let groups={};for(const q of pool)(groups[q.topic]??=[]).push(q);let ids=[],topicOrder=shuf(Object.keys(groups));for(let topic of topicOrder){if(ids.length>=count)break;ids.push(shuf(groups[topic])[0].id)}if(ids.length<count){let rest=shuf(pool.filter(q=>!ids.includes(q.id)).map(q=>q.id));ids.push(...rest.slice(0,count-ids.length))}return ids}
function examSetup(){const e=state.exam,resume=e&&!e.finished;main.innerHTML=head('EXAM ROOM / 15 QUESTIONS','จำลองควิซ 15 ข้อ','โจทย์ 4 ตัวเลือก ไม่มีข้อซ้ำในชุด และแสดงเฉลยหลังส่งคำตอบ')+`<section class="source-card"><h2>ตั้งค่าชุดสอบ</h2><div class="setup"><label>เนื้อหาที่ออก<select id="exam-chapter"><option value="all">ผสม 10.1 + 10.2 (บทละ 7–8 ข้อ)</option><option value="10.1">เฉพาะ 10.1</option><option value="10.2">เฉพาะ 10.2</option></select></label><label>เวลาฝึก<select id="exam-minutes"><option value="0">ไม่จับเวลา</option><option value="20">20 นาที</option><option value="30">30 นาที</option><option value="45">45 นาที</option></select></label></div><div class="notice">ชุดผสมสุ่มให้แต่ละบทมี 7–8 ข้อ และมีทั้งทฤษฎีและคำนวณ · สัดส่วนและเวลาใช้เพื่อฝึก ไม่ใช่รายละเอียดสอบจริงที่ยืนยันแล้ว</div>${resume?`<p>มีชุดสอบที่ยังทำไม่เสร็จ (${Object.keys(e.answers).length}/15 ข้อ)${e.deadline?' · เวลายังคงเดินขณะพัก':''}</p><div class="actions"><button class="primary" data-action="resumeExam">ทำชุดเดิมต่อ →</button><button class="secondary" data-action="restartExam">เริ่มชุดใหม่</button></div>${confirmRestart?'<div class="warning">เริ่มชุดใหม่จะเขียนทับชุดสอบที่ยังไม่ส่ง <div class="actions"><button class="primary btn-sm" data-action="confirmRestartExam">ยืนยันเริ่มชุดใหม่</button><button class="secondary btn-sm" data-action="cancelRestart">ยกเลิก</button></div></div>':''}`:'<button class="primary" data-action="beginExam">เริ่มจำลองสอบ →</button>'}</section>${sourceNote()}`}
function examSelection(ch){
 const pick=(chapter,count)=>{const pool=QUESTIONS.filter(q=>q.chapter===chapter),theory=Math.floor(count/2);return [...topicSelection(pool.filter(q=>q.kind==='theory'),theory),...topicSelection(pool.filter(q=>q.kind==='calculation'),count-theory)]};
 if(ch==='all'){const chapters=['10.1','10.2'],extra=shuf(chapters)[0];return shuf(chapters.flatMap(c=>pick(c,c===extra?8:7)))}
 return shuf(pick(ch,15));
}
function beginExam(){let ch=$('#exam-chapter')?.value||'all',minutes=Number($('#exam-minutes')?.value||0),ids=examSelection(ch);
 state.exam={ids,orders:Object.fromEntries(ids.map(id=>[id,shuf([0,1,2,3])])),answers:{},index:0,chapter:ch,started:Date.now(),deadline:minutes?Date.now()+minutes*60000:null,finished:false};confirmRestart=false;confirmExamSubmit=false;save();setView('exam');}
function exam(){
 teardownScratch();clearInterval(timer);const e=state.exam;if(!e){setView('examSetup');return}if(e.finished){setView('result');return}if(e.deadline&&Date.now()>=e.deadline){finishExam();return}
 if(!e.started){e.started=Date.now();save()}
 const q=find(e.ids[e.index]),selected=e.answers[q.id]??null,answered=Object.keys(e.answers).length;
 main.innerHTML=`<div class="page-head flex-between work-head"><div><div class="eyebrow">EXAM ROOM / QUESTION ${e.index+1} OF 15</div><h1>จำลองควิซ</h1></div><button class="secondary btn-sm" data-view="home">พักก่อน</button></div>
 <div class="work-summary"><div class="work-stats"><span>ตอบแล้ว <strong>${answered}/15</strong></span>${e.deadline?'<span>เวลาที่เหลือ <strong class="timer" id="timer"></strong></span>':'<span>ไม่จับเวลา</span>'}</div><div class="exam-nav" aria-label="ไปยังข้อสอบ">${e.ids.map((id,i)=>`<button class="qnum ${e.answers[id]!==undefined?'answered':''} ${i===e.index?'current':''}" data-action="jumpExam" data-index="${i}" aria-label="ข้อ ${i+1}${e.answers[id]!==undefined?' ตอบแล้ว':''}" ${i===e.index?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><button class="secondary btn-sm work-submit" data-action="askSubmit">ส่งคำตอบ</button></div>
 <div class="scratch-layout"><section class="question-card">${questionUI(q,e.orders[q.id],selected,false,{exam:true})}<div class="exam-actions"><button class="secondary" data-action="examPrev" ${e.index===0?'disabled':''}>← ก่อนหน้า</button>${e.index<e.ids.length-1?'<button class="primary" data-action="examNext">ข้อถัดไป →</button>':'<button class="primary" data-action="askSubmit">ตรวจและส่งชุด →</button>'}</div>${confirmExamSubmit?`<div class="warning exam-warning">${answered<15?`ยังไม่ได้ตอบ ${15-answered} ข้อ ข้อที่ข้ามจะนับเป็น 0 คะแนน`: 'ตอบครบแล้ว พร้อมส่งคำตอบ'}<div class="actions"><button class="primary btn-sm" data-action="confirmSubmit">ยืนยันส่งคำตอบ</button><button class="secondary btn-sm" data-action="cancelSubmit">กลับไปตรวจ</button></div></div>`:''}</section>${scratchMarkup()}</div>`;
 mountScratch(`exam:${e.started}:${q.id}`);if(e.deadline){tick();if(!e.finished)timer=setInterval(tick,1000)}
}
function tick(){const e=state.exam;if(!e||e.finished)return;const left=Math.max(0,Math.ceil((e.deadline-Date.now())/1000)), el=$('#timer');if(el)el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(!left){clearInterval(timer);finishExam()}}
function finishExam(){const e=state.exam;if(!e||e.finished)return;e.finished=true;e.score=0;for(const id of e.ids){const answer=e.answers[id];if(answer!==undefined){const ok=answer===find(id).correct;record(id,ok);if(ok)e.score++}}save();confirmExamSubmit=false;reviewFilter='all';setView('result')}
function result(){const e=state.exam;if(!e||!e.finished){setView('examSetup');return}let answered=Object.keys(e.answers).length;let qs=e.ids.map((id,i)=>({q:find(id),n:i+1,ans:e.answers[id]??null}));if(reviewFilter==='wrong')qs=qs.filter(x=>x.ans!==x.q.correct);main.innerHTML=`<section class="result-hero"><div class="eyebrow">QUIZ COMPLETE / REVIEW YOUR REASONING</div><h1>จบชุดจำลองสอบแล้ว</h1><div class="score">${e.score}<small> / ${e.ids.length}</small></div><p>ตอบแล้ว ${answered}/${e.ids.length} ข้อ · คำตอบที่ข้ามนับ 0 คะแนน</p><div class="actions"><button class="primary" data-view="examSetup">ทำชุดใหม่ →</button><button class="secondary" data-view="home">กลับภาพรวม</button></div></section><div class="section-title"><h2>ทบทวนเฉลยทุกข้อ</h2><div class="actions"><button class="${reviewFilter==='all'?'primary':'secondary'} btn-sm" data-action="reviewFilter" data-filter="all">ทุกข้อ</button><button class="${reviewFilter==='wrong'?'primary':'secondary'} btn-sm" data-action="reviewFilter" data-filter="wrong">ผิด / ข้าม</button></div></div>${qs.length?qs.map(({q,n,ans})=>`<article class="review-item"><div class="question-meta"><span class="tag">ข้อ ${n} · ${esc(q.topic)}</span><span class="micro">${esc(q.id)} · ${esc(q.origin)}</span></div><h3 class="result-question">${esc(q.question)}</h3><p class="review-choice">คำตอบของคุณ: <b>${ans===null?'ยังไม่ได้ตอบ':esc(q.options[ans])}</b></p>${feedback(q,ans)}</article>`).join(''):'<div class="empty">ไม่มีข้อผิดหรือข้ามในชุดนี้</div>'}`}
function bank(){main.innerHTML=head('QUESTION BANK / QUICK REVIEW','คลังข้อสอบ','ค้นหาโจทย์ด้วยคีย์เวิร์ด กรองตามบทหรือหัวข้อ แล้วเปิดดูเฉลยได้ทันที')+`<div class="filters"><input id="bank-query" type="search" placeholder="ค้นหาโจทย์ เช่น NPV, คืนทุน, EAOC" value="${esc(bankFilter.query)}" aria-label="ค้นหาโจทย์"><select id="bank-chapter" aria-label="กรองตามบท"><option value="all">ทุกบท</option><option value="10.1" ${bankFilter.chapter==='10.1'?'selected':''}>10.1</option><option value="10.2" ${bankFilter.chapter==='10.2'?'selected':''}>10.2</option></select><select id="bank-topic" aria-label="กรองตามหัวข้อ"><option value="all">ทุกหัวข้อ</option>${topics().map(t=>`<option value="${esc(t)}" ${bankFilter.topic===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="actions" style="margin-bottom:10px"><button class="secondary btn-sm" data-action="bankWeak">เฉพาะข้อที่ยังผิด</button><button class="secondary btn-sm" data-action="bankSaved">เฉพาะข้อที่บันทึก</button><button class="text-link" data-action="bankReset">ล้างตัวกรอง</button></div><div id="bank-results"></div>`;fillBank()}
let bankSpecial='all';
function fillBank(){const target=$('#bank-results');if(!target)return;const text=bankFilter.query.trim().toLowerCase();let pool=QUESTIONS.filter(q=>(bankFilter.chapter==='all'||q.chapter===bankFilter.chapter)&&(bankFilter.topic==='all'||q.topic===bankFilter.topic)&&(!text||[q.question,q.topic,q.ref,q.options.join(' '),q.why].join(' ').toLowerCase().includes(text))&&(bankSpecial==='all'||(bankSpecial==='weak'&&stat(q.id).lastCorrect===false)||(bankSpecial==='saved'&&state.bookmarks.includes(q.id))));target.innerHTML=`<p class="bank-count">พบ ${pool.length} จาก ${QUESTIONS.length} ข้อ${bankSpecial==='weak'?' · เฉพาะข้อที่ตอบผิดล่าสุด':bankSpecial==='saved'?' · เฉพาะข้อที่บันทึก':''}</p>${pool.length?pool.map(q=>`<article class="bank-row"><div class="question-meta"><span class="tag">${esc(q.chapter)} · ${esc(q.topic)}</span><span class="micro">${q.id} · ${esc(q.origin)}</span></div><h3>${esc(q.question)}</h3><details><summary>ดูเฉลยและวิธีคิด</summary>${feedback(q,null,true)}</details><button class="bookmark ${state.bookmarks.includes(q.id)?'on':''}" data-action="bookmarkBank" data-id="${q.id}">${state.bookmarks.includes(q.id)?'★ บันทึกแล้ว':'☆ บันทึก'}</button><button class="text-link" data-action="singlePractice" data-id="${q.id}">ฝึกข้อนี้ →</button></article>`).join(''):'<div class="empty">ไม่พบข้อที่ตรงกับตัวกรอง ลองคำค้นอื่น</div>'}`}
function render(){switch(view){case 'home':return home();case 'learn':return learn();case 'lesson':return lesson();case 'practiceStart':return practiceStart();case 'practice':return practice();case 'practiceDone':return practiceDone();case 'examSetup':return examSetup();case 'exam':return exam();case 'result':return result();case 'bank':return bank();default:view='home';return home()}}
document.addEventListener('click',e=>{
 const viewEl=e.target.closest('[data-view]');if(viewEl){e.preventDefault();setView(viewEl.dataset.view);return}
 const choice=e.target.closest('[data-choice]');if(choice){const value=Number(choice.dataset.choice);if(view==='practice'){const p=state.practice;if(!p.revealed){p.selected=value;save();practice()}}else if(view==='exam'){const ex=state.exam;if(ex&&!ex.finished){ex.answers[ex.ids[ex.index]]=value;save();exam()}}return}
 const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id;
 switch(action){
 case 'toggleCalc':toggleCalculator();break;
 case 'openLesson': if(LESSONS.some(l=>l.id===id)){lessonId=id;setView('lesson')}break;
 case 'markLesson':if(state.learned.includes(id))state.learned=state.learned.filter(x=>x!==id);else state.learned.push(id);save();lesson();toast(state.learned.includes(id)?'บันทึกว่าอ่านจบแล้ว':'ยกเลิกเครื่องหมายอ่านจบ');break;
 case 'lessonPractice':startPractice('topic','all',el.dataset.topic);break;
 case 'beginPractice':startPractice(el.dataset.mode,$('#practice-chapter')?.value||'all');break;
 case 'confirmPracticeReset':if(pendingPractice){const p=pendingPractice;startPractice(p.mode,p.chapter,p.topic,true,p.singleId||'')}break;
 case 'cancelPracticeReset':confirmPracticeReset=false;pendingPractice=null;practiceStart();break;
 case 'resumePractice':confirmPracticeReset=false;setView('practice');break;
 case 'practiceCheck':checkPractice();break;
 case 'practiceNext':nextPractice();break;
 case 'bookmark':case 'bookmarkBank':if(state.bookmarks.includes(id))state.bookmarks=state.bookmarks.filter(x=>x!==id);else state.bookmarks.push(id);save();if(action==='bookmark'&&view==='practice')practice();else if(view==='bank')fillBank();toast(state.bookmarks.includes(id)?'บันทึกข้อนี้แล้ว':'นำออกจากรายการบันทึก');break;
 case 'beginExam':beginExam();break;
 case 'resumeExam':confirmRestart=false;setView('exam');break;
 case 'restartExam':{const chapter=$('#exam-chapter')?.value||'all',minutes=$('#exam-minutes')?.value||'0';confirmRestart=true;examSetup();if($('#exam-chapter'))$('#exam-chapter').value=chapter;if($('#exam-minutes'))$('#exam-minutes').value=minutes;break;}
 case 'confirmRestartExam':beginExam();break;
 case 'cancelRestart':confirmRestart=false;examSetup();break;
 case 'examPrev':if(state.exam.index>0)state.exam.index--;confirmExamSubmit=false;save();exam();goTop();break;
 case 'examNext':if(state.exam.index<state.exam.ids.length-1)state.exam.index++;confirmExamSubmit=false;save();exam();goTop();break;
 case 'jumpExam':state.exam.index=Number(el.dataset.index);confirmExamSubmit=false;save();exam();goTop();break;
 case 'askSubmit':confirmExamSubmit=true;exam();document.querySelector('.exam-warning')?.scrollIntoView({behavior:'smooth',block:'nearest'});break;
 case 'cancelSubmit':confirmExamSubmit=false;exam();break;
 case 'confirmSubmit':finishExam();break;
 case 'reviewFilter':reviewFilter=el.dataset.filter;result();break;
 case 'bankWeak':bankSpecial=bankSpecial==='weak'?'all':'weak';fillBank();break;
 case 'bankSaved':bankSpecial=bankSpecial==='saved'?'all':'saved';fillBank();break;
 case 'bankReset':bankFilter={query:'',chapter:'all',topic:'all'};bankSpecial='all';bank();break;
 case 'singlePractice':startPractice('single','all','',false,id);break;
 }
});
document.addEventListener('change',e=>{if(e.target.id==='lesson-select'){lessonId=e.target.value;setView('lesson')}else if(e.target.id==='bank-chapter'){bankFilter.chapter=e.target.value;fillBank()}else if(e.target.id==='bank-topic'){bankFilter.topic=e.target.value;fillBank()}});
document.addEventListener('input',e=>{if(e.target.id==='bank-query'){bankFilter.query=e.target.value;fillBank()}});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(view==='practice'&&!e.altKey&&!e.ctrlKey&&!e.metaKey){const p=state.practice;if(!p)return;if(!p.revealed&&/^[1-4]$/.test(e.key)){p.selected=p.orders[p.ids[p.index]][Number(e.key)-1];save();practice()}else if(e.key==='Enter'&&(document.activeElement===main||document.activeElement===document.body)){e.preventDefault();p.revealed?nextPractice():checkPractice()}}});
$('#update').addEventListener('click',()=>{const url=new URL(location.href);url.searchParams.set('refresh',String(Date.now()));location.replace(url.toString())});
setView('home',{focus:false});
</script>
</body></html>
