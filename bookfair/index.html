<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f1e8" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="งานหนังสือ 24 Oct 2026 10:00 @ MRT เพชรบุรี" />
  <title>งานหนังสือ — Countdown</title>
  <style>
    :root {
      --paper: #f5f1e8;
      --paper-2: #ece5d8;
      --ink: #171717;
      --muted: #6d695f;
      --line: rgba(23, 23, 23, 0.11);
      --card: rgba(255, 255, 255, 0.54);
      --accent: #c04a32;
      --shadow: 0 22px 60px rgba(40, 33, 25, 0.09);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 14%, rgba(192, 74, 50, 0.08), transparent 30%),
        radial-gradient(circle at 88% 82%, rgba(80, 74, 63, 0.07), transparent 34%),
        var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      width: min(960px, calc(100% - 32px));
      padding: max(28px, env(safe-area-inset-top)) 0 max(28px, env(safe-area-inset-bottom));
    }

    .shell {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: clamp(28px, 6vw, 68px);
    }

    .shell::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--accent);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 12ch;
      font-size: clamp(2.6rem, 8vw, 6rem);
      line-height: 0.96;
      letter-spacing: -0.055em;
      font-weight: 780;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 9px 16px;
      margin-top: 22px;
      color: var(--muted);
      font-size: clamp(0.98rem, 2.4vw, 1.08rem);
      line-height: 1.5;
    }

    .meta span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .meta span + span::before {
      content: "·";
      color: rgba(23, 23, 23, 0.35);
      margin-right: 8px;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: clamp(34px, 7vw, 72px);
    }

    .unit {
      min-width: 0;
      border-top: 1px solid var(--line);
      padding-top: 18px;
    }

    .value {
      display: block;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      font-size: clamp(2.5rem, 8vw, 5.8rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.06em;
      white-space: nowrap;
    }

    .label {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .done {
      display: none;
      margin-top: clamp(34px, 7vw, 72px);
      border-top: 1px solid var(--line);
      padding-top: 22px;
      font-size: clamp(1.5rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.035em;
    }

    body.finished .countdown { display: none; }
    body.finished .done { display: block; }

    @media (max-width: 620px) {
      main { width: min(100% - 22px, 960px); }
      .shell { border-radius: 24px; padding: 28px 24px 30px; }
      .countdown { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 18px; }
      .meta { display: grid; gap: 4px; }
      .meta span + span::before { display: none; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .shell { animation: arrive 620ms cubic-bezier(.2,.7,.2,1) both; }
      .value { transition: opacity 160ms ease; }
      @keyframes arrive {
        from { opacity: 0; transform: translateY(10px) scale(.995); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="shell" aria-labelledby="event-title">
      <p class="eyebrow">24 OCT 2026 · 10:00</p>
      <h1 id="event-title">งานหนังสือ</h1>

      <div class="meta" aria-label="รายละเอียดนัดหมาย">
        <span>24 Oct 2026 · 10:00</span>
        <span>@ MRT เพชรบุรี</span>
      </div>

      <div class="countdown" role="timer" aria-live="off" aria-label="เวลาที่เหลือถึงงานหนังสือ">
        <div class="unit">
          <span class="value" id="days">00</span>
          <span class="label">วัน</span>
        </div>
        <div class="unit">
          <span class="value" id="hours">00</span>
          <span class="label">ชั่วโมง</span>
        </div>
        <div class="unit">
          <span class="value" id="minutes">00</span>
          <span class="label">นาที</span>
        </div>
        <div class="unit">
          <span class="value" id="seconds">00</span>
          <span class="label">วินาที</span>
        </div>
      </div>

      <div class="done" role="status">ถึงเวลาแล้ว</div>
    </section>
  </main>

  <script>
    (() => {
      const target = new Date('2026-10-24T10:00:00+07:00').getTime();
      const els = {
        days: document.getElementById('days'),
        hours: document.getElementById('hours'),
        minutes: document.getElementById('minutes'),
        seconds: document.getElementById('seconds')
      };

      const pad = (value) => String(value).padStart(2, '0');

      function updateCountdown() {
        const remaining = target - Date.now();

        if (remaining <= 0) {
          document.body.classList.add('finished');
          return;
        }

        const totalSeconds = Math.floor(remaining / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        els.days.textContent = pad(days);
        els.hours.textContent = pad(hours);
        els.minutes.textContent = pad(minutes);
        els.seconds.textContent = pad(seconds);
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    })();
  </script>
</body>
</html>
