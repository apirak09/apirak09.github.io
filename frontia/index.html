<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cinematic Play</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css?v=4">
</head>
<body>
<div id="app" class="shell">
  <main class="page">
    <div class="top">
      <div class="brand">cinematic<i>play</i></div>
      <div class="spacer"></div>
      <button class="iconbtn" type="button" data-nav="settings">⚙</button>
    </div>
    <div class="hero">
      <span class="badge">NEW</span>
      <h1>Midnight Signal</h1>
      <div class="sub">A city that remembers your choices</div>
      <button class="cta" type="button" data-open="ep-midnight">View story</button>
    </div>
    <h2>Recommended for you</h2>
    <div class="cards">
      <button class="card" type="button" data-open="ep-summer"><span class="art summer"></span><span class="cardtitle">After the Last Summer</span><span class="cardmeta">Reconnect before everyone leaves</span></button>
      <button class="card" type="button" data-open="ep-orbit"><span class="art orbit"></span><span class="cardtitle">Orbit 17</span><span class="cardmeta">The station says you arrived alone</span></button>
      <button class="card" type="button" data-open="ep-house"><span class="art house"></span><span class="cardtitle">The House Next Door</span><span class="cardmeta">Someone has been waiting for you</span></button>
    </div>
  </main>
  <nav class="tabs">
    <button class="tab on" type="button" data-nav="home"><span>⌂</span><small>Home</small></button>
    <button class="tab" type="button" data-nav="chat"><span>◌</span><small>Chat</small></button>
    <button class="tab" type="button" data-nav="play"><span>▶</span><small>Play</small></button>
    <button class="tab" type="button" data-nav="settings"><span>⚙</span><small>Settings</small></button>
  </nav>
</div>
<div id="fatal" class="fatal hidden"></div>
<script src="./app.js?v=4" defer></script>
</body>
</html>
